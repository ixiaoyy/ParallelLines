[project]
name = "parallellines-api"
version = "0.1.0"
description = "FastAPI backend for the ParallelLines forum."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17.0",
  "asyncpg>=0.31.0",
  "email-validator>=2.3.0",
  "fastapi>=0.122.0",
  "pydantic-settings>=2.12.0",
  "pwdlib[argon2]>=0.3.0",
  "pyjwt>=2.10.0",
  "redis>=7.0.0",
  "sqlalchemy[asyncio]>=2.0.44",
  "structlog>=25.0.0",
  "uvicorn[standard]>=0.38.0",
  "asyncmy>=0.2.11",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21.0",
  "httpx>=0.28.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
