server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Exact entry routes must not match the physical /games/ asset directory.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /games/ {
        return 301 /games$is_args$args;
    }

    location = /tools/ {
        return 301 /tools$is_args$args;
    }

    location = /games {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /tools {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /service-worker.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
