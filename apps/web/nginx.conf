# Main/Circle 静态容器共用此文件，不能给所有站点都开放状态帧或授权帧。
map "$host:$uri" $parallellines_auth_frame_ancestors {
    default "'none'";
    ~^pingxingxian[.]space:/auth/unified/state/?$ "'self' https://forum.pingxingxian.space https://chat.pingxingxian.space https://api.pingxingxian.space";
    ~^pingxingxian[.]space:/auth/unified/?$ "'self' https://forum.pingxingxian.space";
    ~^forum[.]pingxingxian[.]space:/auth/unified/callback/?$ "'self'";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 仅压缩文本静态资源；保留按编码区分的缓存，图片继续使用自己的压缩格式。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # 在 try_files 改写 $uri 前固定原协议页的 frame 策略，避免落到 index 后丢失允许来源。
    location ~ ^/auth(?:/?$|/unified(?:/.*)?$) {
        access_log off;
        set $unified_frame_ancestors $parallellines_auth_frame_ancestors;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors $unified_frame_ancestors" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Exact entry routes must not match the physical /games/ asset directory.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /games/ {
        return 301 /games$is_args$args;
    }

    location = /tools/ {
        return 301 /tools$is_args$args;
    }

    location = /games {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /tools {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /service-worker.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 第一方采集器为非指纹脚本，短缓存便于定向更新；不扩大其他资源的缓存范围。
    location = /traffic-collector.v1.js {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 非指纹图片允许 CDN 缓存一天并后台重新验证；不扩大到 HTML、上传或私有接口。
    location ~ ^/(?:catalog|games/generals-soldiers)/.+\.(?:png|webp|avif|svg|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
