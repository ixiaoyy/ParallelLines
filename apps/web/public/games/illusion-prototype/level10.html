  <script>
(()=>{

        if(!Number.isFinite(bounds.x0))return;this.lastBounds={...bounds};const pad=.4,scale=Math.min(79,(right-left)/(bounds.x1-bounds.x0+pad*2),(bottom-top)/(bounds.y1-bounds.y0+pad*2)),span=this.height/scale,aspect=this.width/this.height;

/** 将真实构件的局部 bounds 转成终点支持基内 bounds，只在终幕起点捕获一次。 */

  const vertices=renderer.geometries[object.kind].vertices,min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];
  for(let i=0;i<vertices.length;i+=6){const p=inversePoint(endingBase,M.point(object.matrix,[vertices[i],vertices[i+1],vertices[i+2]]));for(let k=0;k<3;k++){min[k]=Math.min(min[k],p[k]);max[k]=Math.max(max[k],p[k]);}}
  return{min,max,center:min.map((v,i)=>(v+max[i])/2)};
}

/** 中心到达后才捕获实际建筑与人物脚点，后续建筑分块移开但不缩放实体。 */

  clearIntent();finishPointer();const a=state.player,g=N('h-goal');endingBase=M.mul(frameMatrix(g.owner),M.trs(...g.p,1,1,1));endingInitialBounds=renderer.lastBounds?{...renderer.lastBounds}:null;
  endingPieces=renderer.static.filter(o=>o.owner!==g.owner&&o.renderRole!=='effect').map((o,index)=>{
    const bounds=endingPieceBounds(o),c=bounds.center;let axis;
    // 完全在脚下或帽顶外的建筑沿远离人物的法向移开，其余沿已在身体之外的侧向退让。
    if(bounds.max[1]<=.005)axis=[0,-1,0];else if(bounds.min[1]>=.72)axis=[0,1,0];else if(bounds.max[0]<-.16)axis=[-1,0,0];else if(bounds.min[0]>.16)axis=[1,0,0];else if(bounds.max[2]<-.16)axis=[0,0,-1];else if(bounds.min[2]>.16)axis=[0,0,1];else{const l=Math.hypot(c[0],c[2]);axis=l>.2?[c[0]/l,0,c[2]/l]:[0,c[1]<0?-1:1,0];}
    return{...o,matrix:new Float32Array(o.matrix),color:[...o.color],walk:null,focus:false,axis,delay:(index%5)*.025,travel:40+(index%3)*2};
  });
  const view=inversePoint(endingBase,[endingBase[12]+CAMERA_DIRECTION[0],endingBase[13]+CAMERA_DIRECTION[1],endingBase[14]+CAMERA_DIRECTION[2]]),facing=Math.atan2(view[0],view[2]);
  // 离场朝屏幕上方或下方的同一侧展开，完整群鸟都会真实飞出固定构图。
  const worldUp=[renderer.view[1],renderer.view[5],renderer.view[9]],localUp=inversePoint(endingBase,worldUp.map((v,i)=>v+endingBase[12+i])),horizontal=Math.hypot(localUp[0],localUp[2]),sign=localUp[1]>=0?1:-1;endingDeparture=horizontal>.001?[sign*localUp[0]/horizontal*16,0,sign*localUp[2]/horizontal*16]:[16,0,0];
  state.ending={phase:ENDING_PHASES[0].name,phaseElapsed:0,elapsed:0,complete:false,history:[ENDING_PHASES[0].name],disassembly:0,returned:false,bird:false,wing:0,crown:0,converted:0,actorVisible:true,fromHeading:a.heading,facing,architecturePieces:endingPieces.length,flock:[]};
  a.actorVisible=true;a.supportMode='grounded';a.supportReason='terminal-platform';a.route=[];a.segment=null;prototype.classList.add('is-ending');result.hidden=true;audio.setCompletionMix(true);audio.complete();

/** 分镜换段仅修改本终幕状态；起飞前一直保留实际台面支撑。 */
function enterEndingPhase(name){
  const e=state.ending;e.phase=name;e.phaseElapsed=0;e.history.push(name);if(e.history.length>ENDING_PHASES.length)e.history.shift();
  if(name==='disassemble')e.returned=true;
  if(name==='transform')e.crown=1;
  if(name==='white-bird'){e.bird=true;state.player.supportMode='grounded';}
  if(name==='title'){state.player.actorVisible=false;e.actorVisible=false;result.textContent='回廊彼岸';result.hidden=false;prototype.classList.add('is-complete');}
}

/** 每帧按有界阶段推进，白鸟真实抬离台面后才切换 flying；标题之前不移除角色。 */
function updateEnding(dt){
  const e=state.ending;if(!e)return;e.elapsed+=dt;let remaining=dt;
  for(let count=0;count<ENDING_PHASES.length&&remaining>1e-9;count++){
    const index=endingPhaseIndex(e.phase),phase=ENDING_PHASES[index],amount=Math.min(remaining,Math.max(0,phase.duration-e.phaseElapsed));e.phaseElapsed+=amount;remaining-=amount;
    if(e.phaseElapsed<phase.duration-1e-8)break;if(index===ENDING_PHASES.length-1){e.complete=true;break;}enterEndingPhase(ENDING_PHASES[index+1].name);
  }
  const index=endingPhaseIndex(e.phase),progress=endingUnit(e.phaseElapsed/ENDING_PHASES[index].duration),a=state.player;
  if(e.phase==='return-geometry'){let angle=e.facing-e.fromHeading;while(angle>Math.PI)angle-=TAU;while(angle< -Math.PI)angle+=TAU;a.heading=e.fromHeading+angle*endingEase(e.phaseElapsed/.65);a.targetHeading=a.heading;}
  if(index>=endingPhaseIndex('disassemble'))e.disassembly=e.phase==='disassemble'?endingEase(progress):1;
  if(index>=endingPhaseIndex('restore-birds'))e.converted=e.phase==='restore-birds'?Math.min(ENDING_FLOCK_COUNT,Math.floor(e.phaseElapsed/.65)):ENDING_FLOCK_COUNT;
  if(e.phase==='crown')e.crown=endingEase(progress);else if(index>endingPhaseIndex('crown'))e.crown=1;
  if(e.phase==='transform'&&progress>=.55)e.bird=true;
  e.wing=e.bird?(.2+Math.sin(e.elapsed*10)*.55)*(e.phase==='white-bird'?.7:1):0;
  // 先在台上展翼，再连续抬升到彩群上方；领飞高度与群鸟的滞后轨迹保持实体净空。
  if(e.phase==='takeoff'||e.phase==='lead-flight'){
    const p=e.phase==='takeoff'?mix([0,0,0],[.6,4,1.3],endingEase(progress)):endingDeparturePoint([.6,4,1.3],progress);a.point=M.point(endingBase,p);a.heading=Math.atan2(endingDeparture[0],endingDeparture[2]);a.targetHeading=a.heading;
    if(distance(a.point,M.point(endingBase,[0,0,0]))>.000001){a.supportMode='flying';a.supportReason='white-bird-flight';}
  }
  a.moving=false;a.blend=0;updateEndingFlock();
}

/** 群鸦按固定十六条间隔轨迹聚拢、逐只复原、盘旋和离开，不产生无界粒子或随机计数。 */

  const e=state.ending,index=endingPhaseIndex(e.phase),gatherIndex=endingPhaseIndex('gather');e.flock=[];if(index<gatherIndex)return;
  const gather=endingEase(e.phase==='gather'?e.phaseElapsed/4:1),restoreTime=Math.max(0,e.elapsed-endingPhaseStart('restore-birds'));
  for(let i=0;i<ENDING_FLOCK_COUNT;i++){
    const angle=i/ENDING_FLOCK_COUNT*TAU+.12,r=2.45+(i%2)*.32,ground=[Math.sin(angle)*(6.5+(r-6.5)*gather),-.7,Math.cos(angle)*(6.5+(r-6.5)*gather)],converted=i<e.converted,orbitAngle=angle+(e.elapsed-18)*.28,orbit=[Math.sin(orbitAngle)*r,2.55+.11*(i%3)+Math.sin(e.elapsed*.9+i)*.16,Math.cos(orbitAngle)*r],lift=converted?endingEase((restoreTime-(i+1)*.65)/1.8):0;let p=mix(ground,orbit,lift),heading=converted?orbitAngle+Math.PI/2:angle+Math.PI;
    // 群鸟共用稍后开始的飞离时标，保持原盘旋间距，避免追越领鸟或相互交叉。
    if(e.phase==='lead-flight'||e.phase==='title'){const progress=e.phase==='title'?1:endingUnit((e.phaseElapsed-.7)/5);p=endingDeparturePoint(p,progress);heading=Math.atan2(endingDeparture[0],endingDeparture[2]);}
    e.flock.push({name:'ending-flock-'+i,index:i,owner:GOAL_PLATFORM.owner,curve:null,point:M.point(endingBase,p),heading,color:converted?ENDING_BIRD_COLORS[i%ENDING_BIRD_COLORS.length]:0x243541,converted,supportMode:converted&&lift>0?'flying':'grounded',wing:converted?Math.sin(e.elapsed*9+i)*.7:0,gait:e.elapsed,blend:0,actorVisible:true});
  }
}

/** 终幕建筑保持真实不透明实例分块离开；同一终点方台在整个地面阶段始终保留。 */

  const e=state.ending;
  for(const piece of endingPieces){const p=endingEase((e.disassembly-piece.delay)/(1-piece.delay)),local=piece.axis.map(v=>v*piece.travel*p),world=frameDirection(endingBase,local),matrix=new Float32Array(piece.matrix);for(let k=0;k<3;k++)matrix[12+k]+=world[k];renderer.static.push({...piece,matrix,walk:null,focus:false});}

  if(e.disassembly>.65){const floor=renderer.add('box',0,-.76,0,40,.12,40,0x11243b,0,renderer.static,endingBase);Object.assign(floor,{id:'ending-ground',owner:GOAL_PLATFORM.owner,renderRole:'surface',focus:false,walk:{top:-.7,endingGround:true}});}

    for(const[p,size,tone]of[[[0,y+.7,0],[6.8,.65,6.8],0x285a98],[[0,y+.22,0],[5.5,.35,5.5],0x2582bc],[[0,y-.1,0],[3.8,.3,3.8],0x2ba4d4]]){const o=renderer.add('box',...p,...size,tone,0,renderer.static,endingBase);Object.assign(o,{id:'ending-blue-monument',owner:GOAL_PLATFORM.owner,renderRole:'architecture',focus:false});}

/** 终幕构图固定在小台、蓝碑和盘旋群鸟；飞离不会驱使 fitViewport 追鸟缩小。 */

  if(e.phase==='restore-birds'&&e.converted<ENDING_FLOCK_COUNT){const bird=e.flock[e.converted],p=inversePoint(endingBase,bird.point),top=16.35,bottom=p[1]+.2,beam=renderer.add('box',p[0],(top+bottom)/2,p[2],.055,top-bottom,.055,0x73dfff,0,renderer.dynamic,endingBase);beam.color[3]=.5;Object.assign(beam,{renderRole:'effect',effect:'restoration-beam',focus:false,occludes:false});const glow=renderer.add('sphere',p[0],p[1]+.25,p[2],.45,.6,.45,0xc7f5ee,0,renderer.dynamic,endingBase);glow.color[3]=.2;Object.assign(glow,{renderRole:'effect',effect:'restoration-glow',focus:false,occludes:false});}

  for(let i=0;i<48;i++){const x=Math.sin(i*8.31)*5.8,y=.4+(i*1.473%7),z=-4.7+Math.cos(i*3.7)*.5,s=.025+(i%7===0?.035:0),o=renderer.add('sphere',x,y,z,s,s,s,0xc6dfe2,0,renderer.dynamic,endingBase);o.color[3]=.55+.25*Math.sin(i+e.elapsed*.6);Object.assign(o,{renderRole:'effect',effect:'ending-star-light',focus:false,occludes:false});}

/** 重开只清本终幕私有快照，游戏初态和声音偏好由既有 reset 统一恢复。 */
function resetEnding(){endingPieces=[];endingBase=null;endingInitialBounds=null;endingDeparture=[16,0,0];}

/** 真实手柄内的世界点同时用于绘制和44像素按钮，不为隐藏手柄保留隔墙热区。 */
function handlePoint(id){const c=controls[id],g=c.grips[c.grip];return M.point(frameMatrix(g.owner),typeof g.point==='function'?g.point():g.point);}
/** 点路和控制透明外圈共用实际主指针，不允许控制不可用时吞掉路面。 */
function startRoadTap(e){if(e.button!==0||pointer||tap||!walkingReady())return;e.preventDefault();audio.unlockGesture(e);canvas.focus({preventScroll:true});tap={id:e.pointerId,x:e.clientX,y:e.clientY};e.currentTarget.setPointerCapture(e.pointerId);}
/** 保留普通路点精度；拖动、取消和失焦都不追加旧点按。 */
function finishRoadTap(e){if(tap?.id!==e.pointerId)return;const p=tap;tap=null;if(Math.hypot(e.clientX-p.x,e.clientY-p.y)>10)return;const r=canvas.getBoundingClientRect();walkTo(pickRoad(e.clientX-r.left,e.clientY-r.top));}
/** 起动先捕获真实局部乘客，拖动期间冻结完整视口边界。 */
function startPointer(e,id){if(e.button!==0||pointer||!controlReady(id)||!takeControl(id))return;e.preventDefault();audio.unlockGesture(e);renderer.gestureFitCache=null;const q=state.controls[id];q.target=q.q;pointer={id:e.pointerId,group:id,x:e.clientX,y:e.clientY,q:q.q,dragged:false,bounds:renderer.lastBounds?{...renderer.lastBounds}:null};buttons[id].setPointerCapture(e.pointerId);}
/** 一次手势有界转动，允许途中反向，周期组最多前后各一周。 */
function dragPointer(e){if(!pointer||pointer.id!==e.pointerId)return;const p=pointer,c=controls[p.group],dx=e.clientX-p.x,dy=e.clientY-p.y;if(Math.hypot(dx,dy)>6)p.dragged=true;if(!p.dragged)return;const q=p.q+sceneInput.rotationDelta(p,dx,dy,100);state.controls[p.group].target=c.cyclic?Math.max(p.q-4,Math.min(p.q+4,q)):Math.max(c.stops[0],Math.min(c.stops.at(-1),q));}

function finishPointer(activate=false){if(!pointer)return;const p=pointer,c=controls[p.group],q=state.controls[p.group];pointer=null;let target=activate&&!p.dragged?(c.cyclic?Math.round(q.q)+1:c.stops.find(n=>n>q.q+.00001)??c.stops[0]):Math.round(activate?q.target:q.q);if(!c.cyclic)target=c.stops.reduce((a,b)=>Math.abs(a-target)<Math.abs(b-target)?a:b);q.target=target;renderer.gestureFitCache=activate&&p.dragged&&ROTARY_FIT_GROUPS.has(p.group)&&p.bounds&&Math.abs(q.q-q.target)>=1e-8?{group:p.group,target:q.target,bounds:{...p.bounds}}:null;const b=buttons[p.group];if(b?.hasPointerCapture(p.id))b.releasePointerCapture(p.id);}
/** 只对实际可见的握点放置按钮；局部不可用保留路面点按，全局接管才禁用原生按钮。 */
function positionControls(){for(const[id,b]of Object.entries(buttons)){const c=controls[id],active=c.when()&&!state.won&&!state.transition;let visible=false;if(active){if(pointer?.group===id)visible=true;else{for(let i=0;i<c.grips.length;i++){const g=c.grips[i],p=renderer.project(M.point(frameMatrix(g.owner),typeof g.point==='function'?g.point():g.point)),hit=pickSceneHit(p.x,p.y);if(hit?.object.handle===id&&hit.object.grip===i){c.grip=i;visible=true;break;}}}}const p=renderer.project(handlePoint(id));b.hidden=!active||!visible;b.style.left=p.x+'px';b.style.top=p.y+'px';b.disabled=failed||state.won||state.goalCentering||!!state.transition;b.setAttribute('aria-disabled',String(!controlReady(id)));}}
/** 重开恢复全部区域、机关、门内进度和终幕；声音选择继续沿用会话设置。 */
function reset(){finishPointer();if(renderer){renderer.gestureFitCache=null;renderer.lastBounds=null;}clearIntent();resetEnding();audio.stop();audio.setCompletionMix(false);state.area='H';state.done={W:false,O:false,P:false};state.flags={};state.activeMotion=null;state.transition=null;state.hubForm=state.hubTarget=0;state.goalCentering=false;state.won=false;state.ending=null;state.pulse=null;for(const[id,c]of Object.entries(controls)){state.controls[id]={q:c.initial,target:c.initial};c.grip=0;}for(const d of Object.values(defs))for(const p of d.plates)p.inside=false;state.player=makeActor('h-start');for(const[id,d]of Object.entries(defs))state.crows[id]=d.crowDefs.map(c=>makeActor(c.start,'crow',c));elapsed=0;lastTime=0;curtain.style.opacity='0';result.hidden=true;prototype.className='prototype scene-H';drawWorld();render();canvas.focus({preventScroll:true});}
/** 致命渲染或支撑错误使用既有错误入口，终止循环并释放输入，不伪装成功。 */
function fatal(error){failed=true;finishPointer();clearIntent();cancelAnimationFrame(animation);audio.stop();failure.hidden=false;for(const b of Object.values(buttons))b.disabled=true;console.error(error);}
/** 按正常时间推进机关、门、真实路点及终幕；后台不补算丢失的时间。 */
function update(dt){elapsed+=dt;if(state.pulse){state.pulse.time+=dt;if(state.pulse.time>.8)state.pulse=null;}if(state.player)state.player.moving=false;if(state.transition){updateDoor(dt);return;}if(state.won){updateEnding(dt);return;}updateMechanisms(dt);drawArchitecture();if(state.goalCentering){updateGoal(dt);return;}if(walkingReady()){if(heldKeys.size&&!state.player.segment&&!state.player.route.length)state.player.route=keyboardStep()||[];follow(state.player,dt);updateCrows(dt);drawActors();updateProgress();
 // 普通行走已消耗本帧时间预算，此处只启动归中并锁输入；后续独占归中分支再按正常 dt 移动。
 if(state.area==='H')updateGoal(0);}const a=state.player;a.blend+=(Number(a.moving)-a.blend)*Math.min(1,dt*12);if(a.moving&&a.gait-a.lastFoot>.23){a.lastFoot=a.gait;audio.footstep();}}
/** 用同一帧实体和角色绘制，然后按真实画面与底栏留白取景。 */
function render(){renderer.resize();drawWorld();renderer.fitViewport();positionControls();renderer.render();}
/** 单帧最多40毫秒，恢复窗口时不追赶历史动作。 */
function frame(time){if(failed||document.hidden)return;try{const dt=lastTime?Math.min((time-lastTime)/1000,.04):0;lastTime=time;update(dt);render();animation=requestAnimationFrame(frame);}catch(error){fatal(error);}}
/** 保持唯一动画循环，后台恢复仍等真实手势解锁声音。 */
function resume(){if(failed||document.hidden)return;cancelAnimationFrame(animation);lastTime=0;animation=requestAnimationFrame(frame);}
// 每个可访问机关入口与实际握点同源；透明外圈遇真实路面交给普通点路。
for(const[id,c]of Object.entries(controls)){const b=document.createElement('button');b.className='scene-control';b.id='control-'+id;b.type='button';b.setAttribute('aria-label',c.label);prototype.append(b);buttons[id]=b;b.addEventListener('pointerdown',e=>{if(e.button!==0||pointer||tap||failed||state.won||state.goalCentering||state.transition)return;const r=canvas.getBoundingClientRect(),hit=pickSceneHit(e.clientX-r.left,e.clientY-r.top);if(hit?.target)startRoadTap(e);else startPointer(e,id);});b.addEventListener('pointermove',dragPointer);b.addEventListener('pointerup',e=>{if(pointer?.id===e.pointerId){dragPointer(e);finishPointer(true);}else finishRoadTap(e);});for(const event of['pointercancel','lostpointercapture'])b.addEventListener(event,e=>{if(pointer?.id===e.pointerId)finishPointer();if(tap?.id===e.pointerId)tap=null;});b.addEventListener('keydown',e=>{if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(e.key)||pointer||!controlReady(id))return;e.preventDefault();audio.unlockGesture(e);if(!takeControl(id))return;const q=state.controls[id],sign=['ArrowDown','ArrowLeft'].includes(e.key)?-1:1,next=Math.round(q.q)+sign;q.target=c.cyclic?next:c.stops.reduce((a,b)=>Math.abs(a-next)<Math.abs(b-next)?a:b);});}
canvas.tabIndex=0;canvas.addEventListener('pointerdown',startRoadTap);canvas.addEventListener('pointerup',finishRoadTap);for(const type of['pointercancel','lostpointercapture'])canvas.addEventListener(type,e=>{if(tap?.id===e.pointerId)tap=null;});
// 按键只从实际当前道路出发；松开最后一键立即停止，不遗留路线或惯性。
window.addEventListener('keydown',e=>{if(!(e.key in keys)||e.target instanceof HTMLButtonElement||e.target instanceof HTMLAnchorElement||!walkingReady())return;e.preventDefault();audio.unlockGesture(e);if(!heldKeys.has(e.key)){state.player.route=[];state.player.segment=null;heldKeys.add(e.key);}});window.addEventListener('keyup',e=>{if(!(e.key in keys))return;heldKeys.delete(e.key);if(!heldKeys.size&&!state.goalCentering&&!state.won){state.player.route=[];state.player.segment=null;}});
// 生命周期只清输入与声音；不会复位机关、区域进度或已接管的终点归中。
window.addEventListener('blur',()=>{finishPointer();clearIntent();audio.stop();});document.addEventListener('visibilitychange',()=>{finishPointer();clearIntent();if(document.hidden){cancelAnimationFrame(animation);audio.suspendOnHidden();}else resume();});window.addEventListener('pagehide',()=>{finishPointer();clearIntent();cancelAnimationFrame(animation);audio.stop();});window.addEventListener('pageshow',resume);
// 地址栏收放或旋转屏幕先释放旧视口手势与移动意图，再按新尺寸重画。
const onViewportResize=()=>{finishPointer();clearIntent();if(!failed&&renderer)render();};window.addEventListener('resize',onViewportResize);window.visualViewport?.addEventListener('resize',onViewportResize);
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();fatal(new Error('WebGL2 context lost'));});
restart.addEventListener('click',reset);soundButton.addEventListener('click',e=>{audio.unlockGesture(e);audio.toggle();try{sessionStorage.setItem(SOUND_PREFERENCE_KEY,audio.enabled?'1':'0');}catch(error){console.warn('Sound preference storage unavailable',{operation:'write',reason:error?.name||'StorageError'});}});
try{renderer=new Tiny3D(canvas);for(const[name,data]of Object.entries(makeTravellerMeshes()))renderer.createGeometry(name,data);installArchitectureMeshes();reset();resume();}catch(error){fatal(error);}

})();
</script>
</body>
</html>
