  <script>
  (() => {

    // 本地原型沿用现有游戏的矩阵与实例绘制方式，仅保留本关所需几何体。

    /** 生成带法线的三角网格；kind 为本关需要的几何类型，返回顶点数组。 */

    /** 本关的固定正交渲染器；canvas 为唯一画布，不加载外部素材。 */
    class Tiny3D {

        gl.enable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.disable(gl.CULL_FACE);this.static=[];this.dynamic=[];this.vp=M.id();this.width=0;this.height=0;

      shader(type,source){const gl=this.gl,shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)){const detail=gl.getShaderInfoLog(shader);gl.deleteShader(shader);throw new Error(detail||'Shader compilation failed');}return shader;}

      createGeometry(name,data){const gl=this.gl,vao=gl.createVertexArray();gl.bindVertexArray(vao);const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);for(let i=0;i<2;i++){gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,3,gl.FLOAT,false,24,i*12);}const instances=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,instances);for(let i=0;i<4;i++){gl.enableVertexAttribArray(i+2);gl.vertexAttribPointer(i+2,4,gl.FLOAT,false,80,i*16);gl.vertexAttribDivisor(i+2,1);}gl.enableVertexAttribArray(6);gl.vertexAttribPointer(6,4,gl.FLOAT,false,80,64);gl.vertexAttribDivisor(6,1);this.geometries[name]={vao,buffer,instances,count:data.length/6,vertices:data};gl.bindVertexArray(null);}

        const rect=this.canvas.getBoundingClientRect(),control=soundButton.getBoundingClientRect(),safe=getComputedStyle(document.documentElement);

        // 短横屏闭盒时不行走，只按顶栏实际边界留白，保留四个44像素选面入口的投影间距。
        const top=Math.max(compactSelection?56:76,...[...document.querySelectorAll('.previous-level,.level-name')].map(e=>e.getBoundingClientRect().bottom-rect.top+(compactSelection?4:12))),bottom=Math.max(top+60,control.top-rect.top-18),left=Math.max(25,(parseFloat(safe.getPropertyValue('--safe-left'))||0)+22),right=this.width-Math.max(25,(parseFloat(safe.getPropertyValue('--safe-right'))||0)+22);
        const scene=state.phase+':'+state.room,gesture=this.gestureBounds;
        if(gesture&&(settledControl(gesture.group)||gesture.bounds.width!==this.width||gesture.bounds.height!==this.height||gesture.bounds.scene!==scene))this.gestureBounds=null;

        let bounds=cached&&cached.width===this.width&&cached.height===this.height&&cached.scene===scene?cached:null;
        if(!bounds){let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;this.meshBounds??=new Map();for(const o of [...this.static,...this.dynamic]){if(o.visible===false||o.decorative||o.color[3]<.3)continue;let bb=this.meshBounds.get(o.kind);if(!bb){const vertices=this.geometries[o.kind]?.vertices;if(!vertices)continue;const lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(let i=0;i<vertices.length;i+=6)for(let j=0;j<3;j++){lo[j]=Math.min(lo[j],vertices[i+j]);hi[j]=Math.max(hi[j],vertices[i+j]);}bb={lo,hi};this.meshBounds.set(o.kind,bb);}for(const x of[bb.lo[0],bb.hi[0]])for(const y of[bb.lo[1],bb.hi[1]])for(const z of[bb.lo[2],bb.hi[2]]){const p=M.point(this.view,M.point(o.matrix,[x,y,z]));x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}}bounds={x0,x1,y0,y1,width:this.width,height:this.height,scene};if(pointer)pointer.bounds=bounds;}
        if(!Number.isFinite(bounds.x0))return;this.lastBounds={...bounds};const pad=.4,scale=Math.min(79,(right-left)/(bounds.x1-bounds.x0+pad*2),(bottom-top)/(bounds.y1-bounds.y0+pad*2)),span=this.height/scale,aspect=this.width/this.height;

        const cx=(bounds.x0+bounds.x1)/2,cy=(bounds.y0+bounds.y1)/2,screenX=(left+right)/2,horizontalShift=span*aspect*(screenX/this.width-.5),screenY=(top+bottom)/2,shift=span*(.5-screenY/this.height);

      project(point){const p=M.point(this.vp,point);return{x:(p[0]+1)*this.width/2,y:(1-p[1])*this.height/2,depth:p[2]};}
      /** 按种类批量绘制本帧物件；最多由本关固定数量的几何组成。 */

  add('traveller_hood',0,0,0,1,1,1,red);
  add('traveller_hood_lip',0,0,0,1,1,1,0xc3483f);

/** 构建并安排一声；kind 为 footstep/snap/complete，when 为音频时间，variation 只轻微改变脚步音色；返回有界声部及停止入口。 */

    noiseHit(when,.075,.23,2350,.75,.35);

// 盒体、房间和展开回廊共用这些构件；演员始终保存构件内脚点，机关运动不改写世界坐标。
const PALETTE={stone:0x777a5e,edge:0xb7b599,dark:0x454f46,inlay:0xa39d69,cyan:0x20dbcc,yellow:0xe0c52e,green:0xb2dc14,purple:0xa95ae6};
const state={room:'cyan',actorRoom:'cyan',phase:'rooms',lights:{cyan:false,yellow:false,green:false,purple:false},plates:Array(7).fill(false),controls:{},player:null,crows:{},transition:null,goalCentering:false,won:false,endingElapsed:0,turn:0,turnTarget:0,bridge:0,bridgeTarget:0,tower:0,towerTarget:0,closing:0,preBridge:0,preStep:0,flap:0,pulse:null};

 lid:{label:'打开盒盖',kind:'toggle',when:()=>state.phase==='rooms'&&['cyan','yellow'].includes(state.room)&&!closedFaces()},
 lift:{label:'升起盒体',kind:'toggle',when:()=>state.phase==='rooms'&&['green','purple'].includes(state.room)&&!closedFaces()},
 'face-cyan':{label:'打开青色盒盖',kind:'face',room:'cyan',when:()=>closedFaces()},
 'face-yellow':{label:'打开黄色盒盖',kind:'face',room:'yellow',when:()=>closedFaces()},
 'face-green':{label:'升起绿色盒体',kind:'face',room:'green',when:()=>closedFaces()},
 'face-purple':{label:'升起紫色盒体',kind:'face',room:'purple',when:()=>closedFaces()},

/** 把世界点转换为刚体构件内坐标；矩阵只含单位旋转与位移。 */
function inversePoint(matrix,p){const d=p.map((n,i)=>n-matrix[12+i]);return[0,1,2].map(i=>d[0]*matrix[i*4]+d[1]*matrix[i*4+1]+d[2]*matrix[i*4+2]);}

function frameMatrix(owner){
 const root=M.trs(0,0,0,1,1,1,state.turn),c=state.controls,unfold=state.phase!=='rooms',close=state.closing;
 const left=unfold?c['wheel-left'].q*(1-close):0,other=unfold?c['wheel-middle'].q*(1-close):0,right=unfold?c['wheel-right'].q*(1-close):0;

 if(owner==='left-panel')return M.mul(combine(M.trs(-2.5,.15+(state.phase==='rooms'?lift:0),0,1,1,1,-HALF)),M.trs(0,0,0,1,1,1,0,-(1-left)*HALF));

/** 注册有稳定名称的踏面节点；when明确所属房间与阶段，避免隐藏通路参与寻路。 */

/** 按稳定节点名返回本关节点；名称未注册时抛错，避免静默接到错误道路。 */
function N(name){const n=defs.nodes.find(n=>n.name===name);if(!n)throw new Error('Unknown box road node '+name);return n;}
/** 把指定节点的局部脚点转换为当前构件下的世界坐标。 */
function point(name){const n=N(name);return M.point(frameMatrix(n.owner),n.p);}
/** 注册实体道路；斜坡分成真实阶梯，导航取同一踏面高度。 */
function road(owner,names,points,when,options={}){for(let i=0;i<names.length;i++)if(!defs.nodes.some(n=>n.name===names[i]))node(names[i],owner,points[i],when);for(let i=1;i<names.length;i++)defs.edges.push({id:names[i-1]+'--'+names[i],owner,a:names[i-1],b:names[i],width:ROAD,when,...options});}

/** 登记按钮节点、指定演员和踩入动作；when控制有效阶段，inside记录真实接触沿。 */
function plate(name,actor,action,when){defs.plates.push({name,actor,action,when,inside:false});}
/** 登记门节点、目标内腔与入口；进门只改变人物位置，盒面仍由玩家手动开合。 */
function door(name,to,entry,when){defs.doors.push({name,to,entry,when});}
/** 完整闭盒只显示四个换面圆点，开口运动及打开后保留原铰链/提盒柄。 */

 else if(location.edge&&edgeAllowed(location.edge,a))for(const name of[location.edge.a,location.edge.b])starts.push({name,cost:distance(actorPoint(a),point(name)),step:{edge:location.edge,t:name===location.edge.a?0:1,location:{node:name}}});

/** 边内点击先沿真实阶梯到同一纵向位置，再走剩余横向距离，完整保留原点击脚点。 */

/** 只有人物可见、开口停稳且没有机关、转场、归中或完成锁定时允许接收行走。 */

function walkTo(target){if(!walkingReady()||!target)return;const route=pathTo(target);state.pulse={point:target.point,time:0,valid:route!==null};if(route){clearIntent();state.player.route=route;}}

/** 灯只在真实踩板时独立点亮；四灯全亮后保留演员所属构件，开始整盒展开。 */
function lightRoom(id){if(state.lights[id])return;state.lights[id]=true;audio.snap();}

 if(state.phase!=='rooms'||!roomOpen()||state.transition)return;const a=state.crows[state.room];if(!a)return;a.moving=false;if(pointer?.group==='slider'||!settledControl('slider')||Math.abs(state.bridge-state.bridgeTarget)>.00001)return;if(a.wait>0){a.wait=Math.max(0,a.wait-dt);return;}

function goalEligible(p=actorPoint()){

}

  if(!goalEligible())return;

  // 共享接边只改归属并保持世界脚点与朝向，不把角色提前移到中心。

/** 有限机关平滑驶向停位；前段构件连续展开，收盒时按相反几何过程恢复完整外壳。 */

}
/** 键盘只选择当前真实可达边；松开立即清除当前段，脚点停在本帧精确位置。 */

 if(loc.node){for(const link of g.get(loc.node)||[]){if(link.port){const n=link.to;for(const next of g.get(n)||[])if(!next.port)choices.push({screen:renderer.project(point(next.to)),steps:[{port:link.edge,to:n,location:{node:n}},{edge:next.edge,t:next.to===next.edge.a?0:1,location:{node:next.to}}]});}else choices.push({screen:renderer.project(point(link.to)),steps:[{edge:link.edge,t:link.to===link.edge.a?0:1,location:{node:link.to}}]});}}

/** 按本帧dt推进机关、演员、接触、门和终点；转场、归中和完成阶段各自接管输入。 */
function update(dt){elapsed+=dt;if(state.pulse)state.pulse.time+=dt;if(state.player)state.player.moving=false;if(state.transition){updateDoor(dt);return;}if(state.won){state.endingElapsed+=dt;if(state.endingElapsed>2){result.hidden=false;prototype.classList.add('is-complete');/* 通关演出结束后开放第九关入口。 */nextLevel.hidden=false;}return;}if(state.goalCentering){updateGoal(dt);return;}updateMechanisms(dt);if(state.phase==='closing')return;updateCrows(dt);if(walkingReady()){if(heldKeys.size&&!state.player.segment&&!state.player.route.length)state.player.route=keyboardStep()||[];follow(state.player,dt);updatePlates();if(!state.transition)for(const d of defs.doors){if(!d.when())continue;if(state.player.blockedDoor!==d.name&&distance(actorPoint(),point(d.name))<.11&&!!supportAt(actorPoint(),state.player.owner)&&actorVisible(state.player)){beginDoor(d);break;}}}else updatePlates();if(state.player.blockedDoor&&distance(actorPoint(),point(state.player.blockedDoor))>.2)state.player.blockedDoor=null;if(state.phase==='final')updateGoal(dt);for(const a of[state.player,...Object.values(state.crows)])a.blend+=(Number(a.moving)-a.blend)*Math.min(1,dt*12);if(state.player.moving&&state.player.gait-state.player.lastFoot>.23){state.player.lastFoot=state.player.gait;audio.footstep();}}

/** 屏幕重心坐标计算仅用于实际几何拾取，保持普通道路上的横向精确落点。 */
function barycentric(x,y,a,b,c){const det=(b.y-c.y)*(a.x-c.x)+(c.x-b.x)*(a.y-c.y);if(Math.abs(det)<1e-8)return null;const u=((b.y-c.y)*(x-c.x)+(c.x-b.x)*(y-c.y))/det,v=((c.y-a.y)*(x-c.x)+(a.x-c.x)*(y-c.y))/det,w=1-u-v;return u>=-.00002&&v>=-.00002&&w>=-.00002?[u,v,w]:null;}
/** 按屏幕坐标命中最近真实三角面；只有最前面的可踩踏面返回精确目标，不穿过建筑。 */
function pickRoad(x,y){let nearest=null;for(const o of renderer.static){if(o.occludes===false||!renderer.geometries[o.kind])continue;const vertices=renderer.geometries[o.kind].vertices;for(let i=0;i<vertices.length;i+=18){const world=[0,1,2].map(j=>M.point(o.matrix,Array.from(vertices.slice(i+j*6,i+j*6+3)))),screen=world.map(p=>renderer.project(p));if(x<Math.min(...screen.map(p=>p.x))||x>Math.max(...screen.map(p=>p.x))||y<Math.min(...screen.map(p=>p.y))||y>Math.max(...screen.map(p=>p.y)))continue;const b=barycentric(x,y,...screen);if(!b)continue;const depth=screen.reduce((s,p,j)=>s+p.depth*b[j],0);if(nearest&&depth>=nearest.depth-1e-7)continue;const p=[0,1,2].map(k=>world.reduce((s,v,j)=>s+v[k]*b[j],0));let target=null;if(o.walk&&surfaceContains(o,p,.005)){if(o.walk.node)target={node:o.walk.node,point:p,owner:o.owner};else{const e=o.walk.edge,t=edgeT(e,p);target={edge:e,t,point:p,owner:o.owner};}}nearest={depth,target};}}return nearest?.target||null;}

/** 按机关id检查阶段、实际停位与输入锁，关闭的盒面才能选择另一面。 */
function controlReady(id){const c=controls[id];if(!c?.when()||failed||state.won||state.goalCentering||state.transition||state.phase==='closing')return false;if(pointer&&pointer.group!==id)return false;if(id==='slider')return settledControl('lift')&&state.controls.lift.q===1;if(id.startsWith('face-'))return mechanismsSettled()&&state.controls.lid.q===0&&state.controls.lift.q===0;if(state.phase==='unfold'){const order=['wheel-left','unfold-slide','wheel-middle','wheel-right'],index=order.indexOf(id);return mechanismsSettled()&&order.slice(index+1).every(next=>state.controls[next].q===0);}return mechanismsSettled();}
/** 接管一个真实主指针并记录机关起点；先清理旧路线，避免拖动与行走同时改写位置。 */
function startPointer(e,id){if(e.button!==0||pointer||!controlReady(id))return;e.preventDefault();audio.unlockGesture(e);clearIntent();pointer={id:e.pointerId,group:id,x:e.clientX,y:e.clientY,q:state.controls[id].q,dragged:false,bounds:null};if(id==='lift'||controls[id].kind==='slider'){const p=handlePoint(id),a=renderer.project(p);let z;if(id==='unfold-slide'){const f=frameMatrix('right-panel'),u=renderer.project(M.point(f,[0,0,0])),v=renderer.project(M.point(f,[0,0,1.1]));z={x:a.x+v.x-u.x,y:a.y+v.y-u.y};}else z=renderer.project([p[0],p[1]+(id==='lift'?6.9:1.4),p[2]]);pointer.track={x:z.x-a.x,y:z.y-a.y};}buttons[id].setPointerCapture(e.pointerId);}
/** 把当前指针位移映射到有限机关行程，保留连续位置，不提前跳到停位。 */
function dragPointer(e){if(!pointer||pointer.id!==e.pointerId)return;const p=pointer,c=controls[p.group],dx=e.clientX-p.x,dy=e.clientY-p.y;if(Math.hypot(dx,dy)>6)p.dragged=true;if(!p.dragged||c.kind==='face')return;const amount=p.track?sceneInput.projectedDelta(dx,dy,p.track.x,p.track.y):sceneInput.rotationDelta(p,dx,dy,95);state.controls[p.group].target=Math.max(0,Math.min(1,p.q+amount));}
/** 释放当前手势并吸附到合法停位；activate表示正常抬手，取消手势不追加点按动作。 */
function finishPointer(activate=false){if(!pointer)return;const p=pointer,c=controls[p.group];if(renderer)renderer.gestureBounds=p.dragged&&(p.group==='lid'||c.kind==='wheel')&&p.bounds?{group:p.group,bounds:{...p.bounds}}:null;pointer=null;if(c.kind==='face'){if(activate&&!p.dragged)beginFace(c.room);}else{const q=state.controls[p.group];q.target=activate&&!p.dragged?(q.q<.5?1:0):Math.round(q.target);}const b=buttons[p.group];if(b?.hasPointerCapture(p.id))b.releasePointerCapture(p.id);audio.snap();}
/** 把44像素按钮定位到真实手柄投影，按可见阶段与输入锁同步隐藏或禁用。 */
function positionControls(){for(const[id,b]of Object.entries(buttons)){const c=controls[id],p=renderer.project(handlePoint(id));b.hidden=!c.when()||state.won||state.transition||state.phase==='closing';b.style.left=p.x+'px';b.style.top=p.y+'px';b.setAttribute('aria-disabled',String(!controlReady(id)));b.disabled=failed||state.goalCentering||state.won||!!state.transition||pointer?.group!==id&&!controlReady(id);}}

/** 重开清除全章灯、按钮、门、机关、乌鸦路线与输入；声音开关沿用会话偏好。 */
function reset(e){finishPointer();if(renderer)renderer.gestureBounds=null;clearIntent();audio.stop();audio.setCompletionMix(false);state.room='cyan';state.actorRoom='cyan';state.phase='rooms';Object.assign(state.lights,{cyan:false,yellow:false,green:false,purple:false});state.plates.fill(false);for(const c of Object.values(state.controls)){c.q=0;c.target=0;}Object.assign(state,{transition:null,goalCentering:false,won:false,endingElapsed:0,turn:0,turnTarget:0,bridge:0,bridgeTarget:0,tower:0,towerTarget:0,closing:0,preBridge:0,preStep:0,flap:0,pulse:null});state.player=makeActor('c-entry');state.crows={green:makeActor('g-crow-start','green'),purple:makeActor('p-start','purple')};for(const p of defs.plates)p.inside=false;elapsed=0;prototype.className='prototype scene-box';result.hidden=true;/* 重开收起下一关并释放隐藏链接上的焦点。 */if(document.activeElement===nextLevel)restart.focus({preventScroll:true});nextLevel.hidden=true;curtain.style.opacity='0';if(e)audio.unlockGesture(e);if(renderer)render();}
/** 只按当前状态绘制并更新取景和按钮，不推进角色、机关或关卡进度。 */
function render(){renderer.resize();drawWorld();renderer.fitViewport();positionControls();renderer.render();}
/** 停止动画和声音并显示既有失败提示，保留诊断错误，不伪装为完成。 */
function fatal(error){failed=true;clearIntent();finishPointer();cancelAnimationFrame(animation);audio.stop();failure.hidden=false;console.error('Illusion runtime failure:',error);}
/** 以有上限的单帧dt推进游戏；隐藏页面停止采样，防止恢复时追赶历史输入。 */
function frame(time){if(failed||document.hidden)return;try{const dt=lastTime?Math.min((time-lastTime)/1000,.04):0;lastTime=time;update(dt);render();animation=requestAnimationFrame(frame);}catch(error){fatal(error);}}
/** 恢复前台动画并清空上一帧时间；失败或仍在后台时不重复启动循环。 */
function resume(){if(failed||document.hidden)return;cancelAnimationFrame(animation);lastTime=0;animation=requestAnimationFrame(frame);}
for(const [id,c]of Object.entries(controls)){const b=document.createElement('button');b.className='scene-control';b.id='control-'+id;b.type='button';b.setAttribute('aria-label',c.label);prototype.append(b);buttons[id]=b;b.addEventListener('pointerdown',e=>startPointer(e,id));b.addEventListener('pointermove',dragPointer);b.addEventListener('pointerup',e=>{if(pointer?.id===e.pointerId)finishPointer(true);});b.addEventListener('pointercancel',()=>finishPointer());b.addEventListener('lostpointercapture',()=>finishPointer());b.addEventListener('keydown',e=>{if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(e.key)||!controlReady(id)||pointer)return;e.preventDefault();audio.unlockGesture(e);clearIntent();if(c.kind==='face')beginFace(c.room);else state.controls[id].target=['ArrowUp','ArrowRight'].includes(e.key)?1:['ArrowDown','ArrowLeft'].includes(e.key)?0:state.controls[id].q<.5?1:0;});}
canvas.tabIndex=0;
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;audio.unlockGesture(e);if(!walkingReady())return;e.preventDefault();canvas.focus({preventScroll:true});tap={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',e=>{if(tap?.id!==e.pointerId)return;const t=tap;tap=null;if(Math.hypot(e.clientX-t.x,e.clientY-t.y)>10)return;const r=canvas.getBoundingClientRect();walkTo(pickRoad(e.clientX-r.left,e.clientY-r.top));});
canvas.addEventListener('pointercancel',()=>{tap=null;});
window.addEventListener('keydown',e=>{if(!(e.key in keys)||e.target instanceof HTMLButtonElement||e.target instanceof HTMLAnchorElement||!walkingReady())return;e.preventDefault();audio.unlockGesture(e);if(!heldKeys.has(e.key)){state.player.route=[];state.player.segment=null;heldKeys.add(e.key);}});
window.addEventListener('keyup',e=>{if(!(e.key in keys))return;heldKeys.delete(e.key);if(!heldKeys.size){state.player.route=[];state.player.segment=null;}});
window.addEventListener('blur',()=>{finishPointer();clearIntent();audio.stop();});
document.addEventListener('visibilitychange',()=>{finishPointer();clearIntent();if(document.hidden){cancelAnimationFrame(animation);audio.suspendOnHidden();}else resume();});
window.addEventListener('pagehide',()=>{finishPointer();clearIntent();cancelAnimationFrame(animation);audio.stop();});window.addEventListener('pageshow',resume);
// 视口变化先释放旧指针与移动意图，再按新尺寸重画，避免旋屏后沿用旧拖动坐标。
const onViewportResize=()=>{finishPointer();clearIntent();if(!failed&&renderer)render();};window.addEventListener('resize',onViewportResize);window.visualViewport?.addEventListener('resize',onViewportResize);
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();fatal(new Error('WebGL2 context lost'));});
restart.addEventListener('click',reset);soundButton.addEventListener('click',e=>{audio.unlockGesture(e);audio.toggle();try{sessionStorage.setItem(SOUND_PREFERENCE_KEY,audio.enabled?'1':'0');}catch(error){console.warn('Sound preference storage unavailable',{operation:'write',reason:error?.name||'StorageError'});}});
try{renderer=new Tiny3D(canvas);for(const [name,mesh]of Object.entries(makeTravellerMeshes()))renderer.createGeometry(name,mesh);installBoxMeshes();reset();resume();}catch(error){fatal(error);}
  })();
  </script>
</body>
</html>
