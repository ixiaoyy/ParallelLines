# 显式启用工作台（/desk 灰度入口）时与原部署文件合并；基础 Compose 不依赖 desk-web。
services:
  desk-web:
    image: parallellines-desk-web:${DESK_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/desk/Dockerfile
      args:
        VITE_DESK_BASE: ${VITE_DESK_BASE:-/desk/}
        VITE_API_BASE_URL: /api/v1
        SOURCE_REVISION: ${SOURCE_REVISION:-}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  nginx:
    volumes:
      - ./deploy/nginx/desk-main.conf:/etc/nginx/desk-main/desk.conf:ro
    depends_on:
      desk-web:
        condition: service_healthy
