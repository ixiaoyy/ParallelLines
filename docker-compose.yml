services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: parallellines
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env.compose
      - path: ./apps/api/.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      UPLOAD_STORAGE_PATH: /var/lib/parallellines/uploads
      BACKUP_STORAGE_PATH: /var/lib/parallellines/backups
    ports:
      - "8000:8000"
    volumes:
      - ./var/uploads:/var/lib/parallellines/uploads
      - ./var/backups:/var/lib/parallellines/backups
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env.compose
      - path: ./apps/api/.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      UPLOAD_STORAGE_PATH: /var/lib/parallellines/uploads
      BACKUP_STORAGE_PATH: /var/lib/parallellines/backups
    volumes:
      - ./var/uploads:/var/lib/parallellines/uploads
      - ./var/backups:/var/lib/parallellines/backups
    depends_on:
      api:
        condition: service_healthy
    command: python -m app.workers.background_jobs

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    expose:
      - "5174"
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  mysql-data:
