services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      UPLOAD_STORAGE_PATH: /var/lib/parallellines/uploads
      BACKUP_STORAGE_PATH: /var/lib/parallellines/backups
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /opt/parallellines/var/uploads:/var/lib/parallellines/uploads
      - /opt/parallellines/var/backups:/var/lib/parallellines/backups
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      UPLOAD_STORAGE_PATH: /var/lib/parallellines/uploads
      BACKUP_STORAGE_PATH: /var/lib/parallellines/backups
    volumes:
      - /opt/parallellines/var/uploads:/var/lib/parallellines/uploads
      - /opt/parallellines/var/backups:/var/lib/parallellines/backups
    depends_on:
      api:
        condition: service_healthy
    command: python -m app.workers.background_jobs

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/parallellines/var/letsencrypt:/etc/letsencrypt
      - /opt/parallellines/var/certbot:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: /bin/sh
    command: >
      -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $$!;
      done"
    volumes:
      - /opt/parallellines/var/letsencrypt:/etc/letsencrypt
      - /opt/parallellines/var/certbot:/var/www/certbot
    depends_on:
      nginx:
        condition: service_healthy
