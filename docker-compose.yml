services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    ports:
      - "8000:8000"
    volumes:
      - upload-data:/var/lib/parallellines/uploads
      - backup-data:/var/lib/parallellines/backups
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    volumes:
      - upload-data:/var/lib/parallellines/uploads
      - backup-data:/var/lib/parallellines/backups
    depends_on:
      api:
        condition: service_healthy
    command: python -m app.workers.background_jobs

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://119.45.0.49:8000/api/v1}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://119.45.0.49:8000/api/v1}
    ports:
      - "5174:5174"
    depends_on:
      api:
        condition: service_healthy

volumes:
  upload-data:
  backup-data:
