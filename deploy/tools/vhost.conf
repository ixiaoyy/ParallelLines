# BEGIN parallellines-tools-managed
server {
    listen 80;
    server_name tools.pingxingxian.space;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name tools.pingxingxian.space;
    access_log off;

    ssl_certificate /etc/letsencrypt/parallellines-tools/live/tools.pingxingxian.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/parallellines-tools/live/tools.pingxingxian.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $tools_backend parallellines-tools-static:80;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        # 保留上游缓存策略，同时禁止边缘代理插入统计脚本或改写静态响应。
        add_header Cache-Control "no-transform" always;
        proxy_pass http://$tools_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }
}
# END parallellines-tools-managed
