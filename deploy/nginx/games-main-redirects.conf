# 主域旧游戏入口首期使用 302 临时重定向到独立游戏站（保留查询串）；
# 待线上稳定验收并完成老用户本地清单迁移后，再切换为 301。
location = /games {
    return 302 https://games.pingxingxian.space/$is_args$args;
}

location ^~ /games/ {
    return 302 https://games.pingxingxian.space$request_uri;
}

location = /play {
    return 302 https://games.pingxingxian.space/$is_args$args;
}

location ^~ /play/ {
    return 302 https://games.pingxingxian.space$request_uri;
}
