# 仅挂载到主域 server 的可选 include 中；使用临时跳转，便于首期发布恢复。
location = /forum {
    return 302 https://forum.pingxingxian.space/$is_args$args;
}
location = /forum/ {
    return 302 https://forum.pingxingxian.space/$is_args$args;
}

# 论坛专属公开页及私有页面沿用原路径；查询参数随 request_uri 一并保留。
location ~ ^/(?:boards|b/[^/]+|topics/[^/]+(?:/[^/]+)?|members/[^/]+|new-topic|search|users|invites|messages(?:/.*)?|events(?:/.*)?|moderation/reviewables|forbidden|email-preferences)/?$ {
    return 302 https://forum.pingxingxian.space$request_uri;
}
location ~ ^/(?:t/[^/]+/[^/]+|p/[^/]+)/?$ {
    return 302 https://forum.pingxingxian.space$request_uri;
}
location ~ ^/admin/(?:forum|analytics|users|system|moderation)/?$ {
    return 302 https://forum.pingxingxian.space$request_uri;
}
