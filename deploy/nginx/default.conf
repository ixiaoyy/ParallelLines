map $uri $parallellines_robots_tag {
    default "";
    ~^/search/?$ "noindex, follow";
    ~^/(?:auth|forbidden|account(?:/.*)?|me|new-topic|invites|email-preferences|messages(?:/.*)?|chat|moderation/reviewables|admin(?:/.*)?|design-system|tools/(?:daily-report|pdf-translation))/?$ "noindex, nofollow";
}

server {
    listen 80;
    server_name pingxingxian.space www.pingxingxian.space _;

    location = /nginx-health {
        access_log off;
        return 204;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://pingxingxian.space$request_uri;
    }
}

server {
    listen 80;
    server_name fable.pingxingxian.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name www.pingxingxian.space _;

    ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://pingxingxian.space$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pingxingxian.space;

    ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api_upstream api:8000;
    set $web_upstream web:80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Robots-Tag $parallellines_robots_tag always;

    location = /nginx-health {
        access_log off;
        return 204;
    }

    location /api/ {
        proxy_pass http://$api_upstream;
    }

    location = /api/v1/pdf-translations {
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://$api_upstream;
    }

    location /uploads/ {
        proxy_pass http://$api_upstream;
    }

    location = /docs {
        proxy_pass http://$api_upstream;
    }

    location = /redoc {
        proxy_pass http://$api_upstream;
    }

    location = /openapi.json {
        proxy_pass http://$api_upstream;
    }

    location = /healthz {
        proxy_pass http://$api_upstream;
    }

    location = /metrics {
        proxy_pass http://$api_upstream;
    }

    location = /sitemap.xml {
        proxy_pass http://$api_upstream;
    }

    location = /robots.txt {
        proxy_pass http://$api_upstream;
    }

    location = / {
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @web_page_fallback;
        proxy_pass http://$api_upstream;
    }

    location = /games/ {
        return 301 /games$is_args$args;
    }

    location = /tools/ {
        return 301 /tools$is_args$args;
    }

    location = /games {
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @web_page_fallback;
        proxy_pass http://$api_upstream;
    }

    location = /tools {
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @web_page_fallback;
        proxy_pass http://$api_upstream;
    }

    # 已登记的工具页面及其示例、下载资源交给 Web；其余工具路径仍沿用下方拦截。
    location ~ ^/tools/(?:excel-formulas|bead-pattern)(?:/.*)?$ {
        proxy_pass http://$web_upstream;
    }

    # 论坛公开页继续由 API 输出语义 HTML；仅 API 故障时回退 Web 外壳。
    location ~ ^/(?:forum|boards|b/[^/]+|topics/[^/]+(?:/[^/]+)?|members/[^/]+)/?$ {
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @web_page_fallback;
        proxy_pass http://$api_upstream;
    }

    # 旧主题短链交给已有 API 规范化，保留原来的重定向与不存在语义。
    location /t/ {
        proxy_pass http://$api_upstream;
    }

    location /p/ {
        proxy_pass http://$api_upstream;
    }

    location = /play/generals-soldiers {
        proxy_pass http://$web_upstream;
    }

    location = /play/generals-soldiers/ {
        return 301 /play/generals-soldiers;
    }

    # 新小游戏只开放明确登记的直达地址，其余旧游戏路径仍回到目录。
    location = /play/snake-escape {
        proxy_pass http://$web_upstream;
    }

    location = /play/snake-escape/ {
        return 301 /play/snake-escape;
    }

    location = /play/flappy-dunk {
        proxy_pass http://$web_upstream;
    }

    location = /play/flappy-dunk/ {
        return 301 /play/flappy-dunk;
    }

    location ^~ /games/generals-soldiers/ {
        proxy_pass http://$web_upstream;
    }

    # 空间错觉原型只开放本目录，直接读取 web 镜像内的独立单页。
    location ^~ /games/illusion-prototype/ {
        proxy_pass http://$web_upstream;
    }

    # 认证、编辑和私有论坛页面由 SPA 接管，刷新时不再跳回游戏目录。
    location ~ ^/(?:auth|new-topic|search|users|invites|account(?:/.*)?|messages(?:/.*)?|events(?:/.*)?|moderation/reviewables|me|forbidden|email-preferences)/?$ {
        proxy_pass http://$web_upstream;
    }

    # 只恢复论坛实际使用的后台页；/admin 本身继续使用目录后台。
    location ~ ^/admin/(?:forum|analytics|users|system|moderation)/?$ {
        proxy_pass http://$web_upstream;
    }

    # 未恢复的工具和游戏路径仍回目录，明确登记的游戏例外保持有效。
    location ~ ^/(?:boards|b|topics|members|users|play|games|tools|events|invites|chat|moderation|design-system)(?:/.*)?$ {
        return 302 /;
    }

    location ~ ^/admin/.+$ {
        return 302 /admin;
    }

    location @web_page_fallback {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://$web_upstream;
    }

    location / {
        proxy_pass http://$web_upstream;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name fable.pingxingxian.space;

    ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $fablespace_web_upstream frontend:80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        proxy_pass http://$fablespace_web_upstream;
    }
}
