server {
    listen 80;
    server_name pingxingxian.space www.pingxingxian.space _;

    location = /nginx-health {
        access_log off;
        return 204;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name fable.pingxingxian.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name pingxingxian.space www.pingxingxian.space _;

    ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api_upstream api:8000;
    set $web_upstream web:80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /nginx-health {
        access_log off;
        return 204;
    }

    location /api/ {
        proxy_pass http://$api_upstream;
    }

    location /uploads/ {
        proxy_pass http://$api_upstream;
    }

    location = /docs {
        proxy_pass http://$api_upstream;
    }

    location = /redoc {
        proxy_pass http://$api_upstream;
    }

    location = /openapi.json {
        proxy_pass http://$api_upstream;
    }

    location = /healthz {
        proxy_pass http://$api_upstream;
    }

    location = /metrics {
        proxy_pass http://$api_upstream;
    }

    location = /sitemap.xml {
        proxy_pass http://$api_upstream;
    }

    location = /robots.txt {
        proxy_pass http://$api_upstream;
    }

    location /t/ {
        proxy_pass http://$api_upstream;
    }

    location /p/ {
        proxy_pass http://$api_upstream;
    }

    location / {
        proxy_pass http://$web_upstream;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name fable.pingxingxian.space;

    ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $fablespace_web_upstream frontend:80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        proxy_pass http://$fablespace_web_upstream;
    }
}
