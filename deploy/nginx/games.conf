# 显式挂载此文件前必须准备 games.pingxingxian.space 域名证书；基础 Nginx 不包含此 vhost。
server {
    listen 80;
    server_name games.pingxingxian.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location ~ ^/auth(?:/?$|/unified(?:/.*)?$) {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 301 https://games.pingxingxian.space$request_uri;
    }
    location / {
        return 301 https://games.pingxingxian.space$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name games.pingxingxian.space;
    ssl_certificate /etc/letsencrypt/live/games.pingxingxian.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.pingxingxian.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $games_api_upstream api:8000;
    set $games_web_upstream games-web:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    add_header X-Robots-Tag $parallellines_robots_tag always;

    # Games callback 仅给同源隐藏授权帧；其他登录/退出页不开放跨站嵌入。
    location ~ ^/auth(?:/?$|/unified(?:/.*)?$) {
        access_log off;
        set $unified_frame_ancestors $parallellines_auth_frame_ancestors;
        proxy_hide_header Cache-Control;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors $unified_frame_ancestors" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://$games_web_upstream;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # 游戏站与主站复用同一套 API 与上传存储，不复制数据库或账号。
    location /api/ {
        proxy_pass http://$games_api_upstream;
    }
    location /uploads/ {
        proxy_pass http://$games_api_upstream;
    }
    location = /healthz {
        proxy_pass http://$games_api_upstream;
    }
    location = /sitemap.xml {
        proxy_pass http://$games_api_upstream;
    }
    location = /robots.txt {
        proxy_pass http://$games_api_upstream;
    }

    # 独立游戏站内 /games 归一化到根路径，保留查询串。
    location = /games {
        return 302 /$is_args$args;
    }
    location = /games/ {
        return 302 /$is_args$args;
    }

    # 登录发行方与 OIDC 仍归主站；圈子、工具与 Chat 跳回各自独立入口。
    location = /auth/chat {
        return 302 https://pingxingxian.space$request_uri;
    }
    location = /auth/oidc {
        return 302 https://pingxingxian.space$request_uri;
    }
    location ^~ /auth/oidc/ {
        return 302 https://pingxingxian.space$request_uri;
    }
    location = /forum {
        return 302 https://forum.pingxingxian.space/$is_args$args;
    }
    location ^~ /forum/ {
        return 302 https://forum.pingxingxian.space$request_uri;
    }
    location = /chat {
        return 303 https://chat.pingxingxian.space/;
    }
    location ^~ /chat/ {
        return 303 https://chat.pingxingxian.space/;
    }
    location = /tools {
        return 302 https://tools.pingxingxian.space/;
    }

    location / {
        proxy_pass http://$games_web_upstream;
    }
}
