# 显式挂载此文件前必须准备论坛域名证书；基础 Nginx 不包含此 vhost。
server {
    listen 80;
    server_name forum.pingxingxian.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://forum.pingxingxian.space$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name forum.pingxingxian.space;
    ssl_certificate /etc/letsencrypt/live/forum.pingxingxian.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forum.pingxingxian.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $forum_api_upstream api:8000;
    set $forum_web_upstream forum-web:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    add_header X-Robots-Tag $parallellines_robots_tag always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # 论坛与原主站使用同一个 API 和上传存储，不复制数据，也不新增浏览器跨源请求。
    location /api/ {
        proxy_pass http://$forum_api_upstream;
    }
    location = /api/v1/notifications/stream {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_pass http://$forum_api_upstream;
    }
    location /uploads/ {
        proxy_pass http://$forum_api_upstream;
    }
    location = /healthz {
        proxy_pass http://$forum_api_upstream;
    }
    location = /sitemap.xml {
        proxy_pass http://$forum_api_upstream;
    }
    location = /robots.txt {
        proxy_pass http://$forum_api_upstream;
    }

    # 公共页面继续输出原论坛语义首屏；API 5xx 时才回退对应的论坛静态外壳。
    location = / {
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @forum_web_fallback;
        proxy_pass http://$forum_api_upstream;
    }
    location = /forum {
        return 302 /$is_args$args;
    }
    location = /forum/ {
        return 302 /$is_args$args;
    }
    location ~ ^/(?:boards|b/[^/]+|topics/[^/]+(?:/[^/]+)?|members/[^/]+)/?$ {
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @forum_web_fallback;
        proxy_pass http://$forum_api_upstream;
    }
    location /t/ {
        proxy_pass http://$forum_api_upstream;
    }
    location /p/ {
        proxy_pass http://$forum_api_upstream;
    }

    # 登录发行方仍属于主站；论坛不会接管 Chat/OIDC 协议或改变其客户端身份。
    location = /auth/chat {
        return 302 https://pingxingxian.space$request_uri;
    }
    location = /auth/oidc {
        return 302 https://pingxingxian.space$request_uri;
    }
    location ^~ /auth/oidc/ {
        return 302 https://pingxingxian.space$request_uri;
    }
    location = /chat {
        return 303 https://chat.pingxingxian.space/;
    }
    location ^~ /chat/ {
        return 303 https://chat.pingxingxian.space/;
    }

    # 游戏与工具仍由各自入口负责，论坛站不承接它们的页面或运行资源。
    location ~ ^/(?:games|play|tools)(?:/.*)?$ {
        return 302 https://pingxingxian.space$request_uri;
    }
    location @forum_web_fallback {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://$forum_web_upstream;
    }
    location / {
        proxy_pass http://$forum_web_upstream;
    }
}
