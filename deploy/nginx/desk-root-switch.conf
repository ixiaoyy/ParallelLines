# Phase 4 正式切流片段：配合 desk-main.conf（VITE_DESK_BASE=/desk/）将 pingxingxian.space 精确根路径 / 切换为工作台。
# 因为工作台静态资源走 /desk/assets/*，不会与主站 /assets/* 冲突，也不影响 /api/ /auth/ /login /admin /settings。
# 若需秒级回退，仅移除此挂载并 reload Nginx 即可恢复原首页。
location = / {
    set $desk_web_upstream desk-web:80;
    proxy_pass http://$desk_web_upstream/index.html;
}
