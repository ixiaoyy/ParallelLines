name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: parallellines_ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install backend dependencies
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check app tests
      - name: Alembic upgrade on MySQL
        env:
          DATABASE_URL: mysql+asyncmy://root:root@127.0.0.1:3306/parallellines_ci?charset=utf8mb4
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-secret-change-me-123456
        run: uv run alembic upgrade head
      - name: Pytest
        env:
          DATABASE_URL: mysql+asyncmy://root:root@127.0.0.1:3306/parallellines_ci?charset=utf8mb4
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-secret-change-me-123456
        run: uv run pytest -q
      - name: OpenAPI snapshot
        run: uv run python scripts/export_openapi.py --check

  frontend:
    name: Frontend lint typecheck build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --dir apps/web lint
      - name: OpenAPI generated types
        run: pnpm --dir apps/web openapi:check
      - name: Typecheck
        run: pnpm --dir apps/web typecheck
      - name: Build
        run: pnpm --dir apps/web build

  smoke:
    name: Playwright MVP smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: parallellines_smoke
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install uv
          uv --directory apps/api sync --frozen
          pnpm install --frozen-lockfile
          pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Prepare API database
        working-directory: apps/api
        env:
          DATABASE_URL: mysql+asyncmy://root:root@127.0.0.1:3306/parallellines_smoke?charset=utf8mb4
          ENVIRONMENT: test
          JWT_SECRET_KEY: smoke-test-secret-change-me-123456
        run: |
          uv run alembic upgrade head
      - name: Start API and Web, then run smoke tests
        env:
          DATABASE_URL: mysql+asyncmy://root:root@127.0.0.1:3306/parallellines_smoke?charset=utf8mb4
          ENVIRONMENT: test
          JWT_SECRET_KEY: smoke-test-secret-change-me-123456
          VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          PLAYWRIGHT_API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: |
          uv --directory apps/api run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          pnpm --dir apps/web dev --host 127.0.0.1 --port 5173 &
          python - <<'PY'
          import time
          import urllib.request
          for url in ("http://127.0.0.1:8000/healthz", "http://127.0.0.1:5173"):
              for _ in range(60):
                  try:
                      urllib.request.urlopen(url, timeout=2)
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise SystemExit(f"Timed out waiting for {url}")
          PY
          pnpm --dir apps/web test:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
