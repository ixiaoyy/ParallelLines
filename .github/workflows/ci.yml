name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            workflow:
              - '.github/workflows/ci.yml'

  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflow == 'true'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: parallellines_ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install backend dependencies
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check app tests
      - name: Alembic upgrade on MySQL
        env:
          DATABASE_URL: mysql+asyncmy://root:root@127.0.0.1:3306/parallellines_ci?charset=utf8mb4
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-secret-change-me-123456
        run: uv run alembic upgrade head
      - name: Pytest
        env:
          DATABASE_URL: mysql+asyncmy://root:root@127.0.0.1:3306/parallellines_ci?charset=utf8mb4
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-secret-change-me-123456
        run: uv run pytest -q
      - name: OpenAPI snapshot
        run: uv run python scripts/export_openapi.py --check

  frontend:
    name: Frontend lint typecheck build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --dir apps/web lint
      - name: OpenAPI generated types
        run: pnpm --dir apps/web openapi:check
      - name: Typecheck
        run: pnpm --dir apps/web typecheck
      - name: Build
        run: pnpm --dir apps/web build
