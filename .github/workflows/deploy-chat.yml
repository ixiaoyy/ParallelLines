name: Diagnose chat session (temporary branch only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-session-readonly-diagnostics
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read a fixed historical log window using the existing SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: SHA256:3XgT+rjG+BpWEyVWUwI2p2SVojjzHpSxrbUFhLj15Ws
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 2m
          script: |
            set -eu
            umask 077
            cd /opt/parallellines
            revision='${{ github.sha }}'
            case "$revision" in ''|*[!0-9a-f]*) exit 2 ;; esac
            test "${#revision}" -eq 40
            git fetch origin refs/heads/chat-session-diagnostics
            test "$(git rev-parse FETCH_HEAD)" = "$revision"
            command -v python3 >/dev/null
            diagnostic_file=$(mktemp "/tmp/chat-session-diag-${revision}-XXXXXX.py")
            trap 'rm -f -- "$diagnostic_file"' EXIT
            git show "${revision}:session-diagnostics/diagnose-session.py" > "$diagnostic_file"
            sudo python3 "$diagnostic_file" < /dev/null
