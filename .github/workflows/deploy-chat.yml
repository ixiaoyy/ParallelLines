name: Deploy family chat

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only server preflight or deploy the disabled chat service
        type: choice
        options: [preflight, deploy]
        default: preflight
      initialize_application_secrets:
        description: Generate five server-local app secrets only after explicit owner approval
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  chat:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect or deploy using the existing production SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: SHA256:3XgT+rjG+BpWEyVWUwI2p2SVojjzHpSxrbUFhLj15Ws
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 30m
          script: |
            set -eu
            cd /opt/parallellines
            git fetch origin main
            test "$(git rev-parse origin/main)" = "${{ github.sha }}"
            git show '${{ github.sha }}:deploy/librechat/release.sh' | bash -s -- '${{ inputs.mode }}' '${{ github.sha }}' '${{ inputs.initialize_application_secrets }}'
