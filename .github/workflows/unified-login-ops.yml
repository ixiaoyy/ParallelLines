name: Unified login operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed reviewed operation; inventory never changes services
        type: choice
        required: true
        default: inventory
        options: [inventory, describe, describe-source, prepare, activate-main, remove-source-archive]

permissions:
  contents: read

concurrency:
  group: ${{ (inputs.operation == 'prepare' || inputs.operation == 'activate-main' || inputs.operation == 'remove-source-archive') && 'deploy-production' || format('unified-login-read-{0}', inputs.operation) }}
  cancel-in-progress: false

jobs:
  inventory:
    if: github.repository == 'ixiaoyy/ParallelLines' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the fixed read-only operation
        id: payload
        env:
          OPERATION: ${{ inputs.operation }}
          OPERATOR_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import hashlib
          import json
          import re
          import uuid
          operation = os.environ['OPERATION']
          sources = {'inventory': 'unified_login_ops.py', 'describe': 'unified_nginx_release.py',
                     'describe-source': 'unified_nginx_release.py'}
          if operation not in sources and operation not in ('prepare', 'activate-main', 'remove-source-archive'):
              raise SystemExit('Unsupported operation')
          if operation in ('prepare', 'activate-main', 'remove-source-archive'):
              revision = os.environ['OPERATOR_REVISION']
              if not re.fullmatch('[0-9a-f]{40}', revision):
                  raise SystemExit('Invalid operator revision')
              names = ['unified_login_ops.py', 'unified_artifact_prepare.py', 'unified-login-release-plan.json',
                       'unified_nginx_release.py', 'unified_source_alignment.py']
              manifest = {name: hashlib.sha256((Path('.github/scripts') / name).read_bytes()).hexdigest() for name in names}
              # 复用服务器现有Git对象通道；只取本仓固定提交公开运维文件，不读取或传输服务器凭据。
              source = "import os,subprocess,hashlib,json\nfrom pathlib import Path\n"
              source += 'revision=' + repr(revision) + '\nmanifest=' + repr(manifest) + '\noperation=' + repr(operation) + '\n'
              source += r'''
          repository=Path('/opt/parallellines')
          base=['git','--no-optional-locks','-c','safe.directory=/opt/parallellines','-c','credential.helper=','-C',str(repository)]
          env={**os.environ,'GIT_TERMINAL_PROMPT':'0','GIT_ASKPASS':'/bin/false'}
          subprocess.run(base+['fetch','--no-tags','https://github.com/ixiaoyy/ParallelLines.git',revision],check=True,timeout=180,env=env)
          root=Path('/data/deployment/parallellines-unified/operator')/revision
          if any(p.is_symlink() for p in (root,*root.parents)): raise SystemExit('Unsafe operator path')
          root.mkdir(parents=True,exist_ok=True,mode=0o700)
          for name,expected in manifest.items():
              data=subprocess.check_output(base+['show',revision+':.github/scripts/'+name],timeout=20,env=env)
              if hashlib.sha256(data).hexdigest()!=expected: raise SystemExit('Operator source changed')
              target=root/name
              if target.exists() and (target.is_symlink() or target.read_bytes()!=data): raise SystemExit('Operator collision')
              if not target.exists():
                  with target.open('xb') as stream: stream.write(data)
                  target.chmod(0o600)
          os.execv('/usr/bin/python3',['/usr/bin/python3','-B',str(root/'unified_login_ops.py'),operation])
          '''
          else:
              source = (Path('.github/scripts') / sources[operation]).read_text(encoding='utf-8')
          if len(source.encode()) > 120000:
              raise SystemExit('Operation exceeds bounded transport')
          marker = 'PL_UNIFIED_' + uuid.uuid4().hex
          script = "set -eu\nsudo -n python3 -B - " + operation + " <<'" + marker + "'\n" + source + '\n' + marker + '\n'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('script<<' + marker + '_OUTPUT\n' + script + marker + '_OUTPUT\n')
          PY
      - name: Inventory current production targets
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          fingerprint: SHA256:3XgT+rjG+BpWEyVWUwI2p2SVojjzHpSxrbUFhLj15Ws
          timeout: 30s
          command_timeout: ${{ inputs.operation == 'prepare' && '40m' || inputs.operation == 'activate-main' && '20m' || '4m' }}
          # 与现有community通道一致；script_stop会把检查语句插入Python heredoc正文。
          script_stop: false
          script: ${{ steps.payload.outputs.script }}
