name: Tools operations

on:
  push:
    branches: [ops/tools-deploy-20261109]
    paths:
      - .github/workflows/tools-ops.yml
      - deploy/tools/**
  workflow_dispatch:
    inputs:
      operation:
        description: Push only inventories; all write operations require explicit dispatch
        type: choice
        required: true
        default: inventory
        options: [inventory, health, main-web-inventory, prepare-tls, deploy, rollback, deploy-main-web, rollback-main-web]
      release_tag:
        description: Required for deploy/rollback; site-<40 hex> or main-web-<40 hex> for main Web
        type: string
        required: false
        default: ''
      receipt_sha256:
        description: Required for deploy; trusted SHA256 of deployment-receipt.json or web-image.json
        type: string
        required: false
        default: ''
      main_web_run_id:
        description: Required for deploy-main-web; exact producer workflow run ID in schema 2
        type: string
        required: false
        default: ''
      expected_config_sha256:
        description: Required for prepare-tls/deploy; trusted local preimage, not a masked log value
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # 只读健康入口不等待写阶段，以便部署执行通道出错时仍可独立检查。
  group: ${{ github.event_name == 'push' && 'tools-read-inventory' || inputs.operation == 'health' && 'tools-read-health' || inputs.operation == 'main-web-inventory' && 'tools-read-main-web-inventory' || inputs.operation == 'inventory' && 'tools-read-inventory' || 'deploy-production' }}
  cancel-in-progress: false

jobs:
  inventory:
    name: ${{ github.event_name == 'push' && 'Read-only inventory' || inputs.operation }}
    # 只信任本仓库已明确授权的运维分支；不接 PR、main 或任意 dispatch ref。
    if: >-
      github.repository == 'ixiaoyy/ParallelLines' &&
      github.ref == 'refs/heads/ops/tools-deploy-20261109' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.operation == 'inventory' || inputs.operation == 'health' || inputs.operation == 'main-web-inventory' || inputs.operation == 'prepare-tls' || inputs.operation == 'deploy' || inputs.operation == 'rollback' || inputs.operation == 'deploy-main-web' || inputs.operation == 'rollback-main-web')))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPERATION: ${{ github.event_name == 'push' && 'inventory' || inputs.operation }}
      EXPECTED_CONFIG_SHA256: ${{ inputs.expected_config_sha256 }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
      MAIN_WEB_RUN_ID: ${{ inputs.main_web_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare the reviewed explicit operation
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import uuid

          operation = os.environ["OPERATION"]
          scripts = {"inventory": "inventory.py", "health": "health.py", "main-web-inventory": "main_web.py", "prepare-tls": "tls.py", "deploy": "deploy.py", "rollback": "rollback.py", "deploy-main-web": "main_web.py", "rollback-main-web": "main_web.py"}
          if operation not in scripts:
              raise SystemExit("Unsupported tools operation")
          arguments = operation
          if operation in ("prepare-tls", "deploy", "deploy-main-web"):
              expected = os.environ.get("EXPECTED_CONFIG_SHA256", "")
              if not re.fullmatch(r"[0-9a-f]{64}", expected):
                  raise SystemExit("A trusted complete preimage is required")
          if operation in ("deploy", "rollback"):
              tag = os.environ.get("RELEASE_TAG", "")
              if not re.fullmatch(r"site-[0-9a-f]{40}", tag):
                  raise SystemExit("A complete public release tag is required")
          if operation == "prepare-tls":
              arguments += " " + expected
          elif operation == "deploy":
              receipt = os.environ.get("RECEIPT_SHA256", "")
              if not re.fullmatch(r"[0-9a-f]{64}", receipt):
                  raise SystemExit("A trusted complete receipt digest is required")
              arguments += " " + tag + " " + receipt + " " + expected
          elif operation == "rollback":
              arguments += " " + tag[5:]
          elif operation in ("deploy-main-web", "rollback-main-web"):
              tag = os.environ.get("RELEASE_TAG", "")
              if not re.fullmatch(r"main-web-[0-9a-f]{40}", tag):
                  raise SystemExit("A complete public main Web release tag is required")
              if operation == "deploy-main-web":
                  receipt = os.environ.get("RECEIPT_SHA256", "")
                  run_id = os.environ.get("MAIN_WEB_RUN_ID", "")
                  if not re.fullmatch(r"[0-9a-f]{64}", receipt) or not re.fullmatch(r"[0-9]{1,20}", run_id):
                      raise SystemExit("A trusted receipt digest and exact producer run ID are required")
                  arguments += " " + tag + " " + receipt + " " + run_id + " " + expected
              else:
                  arguments += " " + tag[9:]
          source = (Path("deploy/tools") / scripts[operation]).read_text(encoding="utf-8")
          if operation in ("prepare-tls", "deploy", "rollback", "deploy-main-web", "rollback-main-web"):
              main_web = operation in ("deploy-main-web", "rollback-main-web")
              names = ("main_web.py", "managed_config.py", "tls.py", "health.py", "github_assets.py") if main_web else ("deploy.py", "rollback.py", "release_contract.py", "managed_config.py", "tls.py", "health.py", "vhost.conf", "github_assets.py")
              bundle = {name: (Path("deploy/tools") / name).read_text(encoding="utf-8") for name in names}
              dependencies = ["managed_config", "github_assets"]
              if main_web:
                  bundle["deploy_artifacts.py"] = Path(".github/scripts/deploy_artifacts.py").read_text(encoding="utf-8")
                  dependencies += ["deploy_artifacts", "health", "tls"]
              elif operation in ("deploy", "rollback"):
                  dependencies += ["release_contract", "health", "tls"]
              if operation == "rollback":
                  dependencies += ["deploy"]
              # 只打包此提交中已审核的公开 source；不是生产响应的编码/脱敏替代通道。
              prefix = "import sys, types\nOPS_SOURCES = " + repr(bundle) + "\n"
              prefix += "for _name in " + repr(dependencies) + ":\n"
              prefix += "    _module = types.ModuleType(_name)\n"
              prefix += "    _module.__file__ = '/opt/parallellines-tools/ops/' + _name + '.py'\n"
              prefix += "    _module.OPS_SOURCES = OPS_SOURCES\n"
              prefix += "    sys.modules[_name] = _module\n"
              prefix += "    exec(compile(OPS_SOURCES[_name + '.py'], _module.__file__, 'exec'), _module.__dict__)\n"
              # 选定入口已在静态 source 包内，直接执行，避免重复携带约31KB突破 SSH exec 单串限制。
              source = prefix + "exec(compile(OPS_SOURCES[" + repr(scripts[operation]) + "], '/opt/parallellines-tools/ops/" + scripts[operation] + "', 'exec'), globals())\n"
          marker = "TOOLS_INVENTORY_" + uuid.uuid4().hex
          payload = "set -eu\nsudo -n python3 -B - " + arguments + " <<'" + marker + "'\n" + source + "\n" + marker + "\n"
          if len(payload.encode("utf-8")) > 120000:
              raise SystemExit("Reviewed source exceeds the bounded SSH exec transport")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("script<<" + marker + "_OUTPUT\n" + payload + marker + "_OUTPUT\n")
          PY
      - name: Execute only the selected tools operation
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          fingerprint: SHA256:3XgT+rjG+BpWEyVWUwI2p2SVojjzHpSxrbUFhLj15Ws
          timeout: 30s
          command_timeout: ${{ (inputs.operation == 'deploy' || inputs.operation == 'deploy-main-web') && '35m' || '10m' }}
          # drone-ssh 的逐行停止注入会破坏 heredoc；退出状态由 payload 的 set -eu 和末条 Python 命令保留。
          script_stop: false
          script: ${{ steps.payload.outputs.script }}
