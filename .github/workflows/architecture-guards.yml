name: Architecture Guards

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture-guards:
    name: Verify account, ops, gateway, and shared-facility boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unified architecture guards
        run: node .github/scripts/run_architecture_guards.mjs

      - name: Run architecture guard unit tests
        run: >
          node --test
          .github/scripts/verify_account_pilot_contract.test.mjs
          .github/scripts/verify_account_write_boundaries.test.mjs
          .github/scripts/verify_ops_boundaries.test.mjs
          .github/scripts/verify_shared_facilities_boundaries.test.mjs
          deploy/nginx/sites.d/verify-gateway-sites.test.mjs
