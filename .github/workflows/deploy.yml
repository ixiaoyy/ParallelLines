name: Deploy

on:
  workflow_dispatch:
    inputs:
      repair_fablespace_sso:
        description: Repair the shared ParallelLines/FableSpace SSO configuration
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "deploy/nginx/**"
      - "docker-compose.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect deploy scope
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      nginx: ${{ steps.filter.outputs.nginx }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/api/**'
            frontend:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            nginx:
              - 'deploy/nginx/**'
            compose:
              - 'docker-compose.yml'

  repair-fablespace-sso:
    name: Repair FableSpace SSO
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.repair_fablespace_sso

    steps:
      - name: Validate server configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done

      - name: Synchronize SSO configuration and restart backends
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 20m
          script: |
            set -eu
            FABLESPACE_PATH="/opt/fablespace"
            cd "${FABLESPACE_PATH}"
            git remote set-url origin https://github.com/ixiaoyy/FableSpace.git
            git fetch --prune origin main
            git reset --hard origin/main

            CONFIG_OUTPUT="$(sudo python3 deploy/server/configure_shared_services.py --cors-origin https://fable.pingxingxian.space)"
            printf '%s\n' "${CONFIG_OUTPUT}"

            cd /opt/parallellines
            if sudo docker compose version >/dev/null 2>&1; then
              PARALLELLINES_COMPOSE="sudo docker compose"
            else
              PARALLELLINES_COMPOSE="sudo docker-compose"
            fi
            $PARALLELLINES_COMPOSE up -d --no-deps --force-recreate api worker
            PARALLELLINES_READY=false
            for ATTEMPT in $(seq 1 30); do
              if $PARALLELLINES_COMPOSE exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()" >/dev/null 2>&1; then
                PARALLELLINES_READY=true
                break
              fi
              sleep 2
            done
            if [ "${PARALLELLINES_READY}" != "true" ]; then
              $PARALLELLINES_COMPOSE logs --tail=120 api
              echo "ParallelLines API health check failed after SSO repair"
              exit 1
            fi

            cd "${FABLESPACE_PATH}"
            if sudo docker compose version >/dev/null 2>&1; then
              FABLESPACE_COMPOSE="sudo docker compose"
            else
              FABLESPACE_COMPOSE="sudo docker-compose"
            fi
            FABLESPACE_COMPOSE_FILES="-f docker-compose.yml -f deploy/docker-compose.shared.yml"
            $FABLESPACE_COMPOSE $FABLESPACE_COMPOSE_FILES up -d --build backend
            FABLESPACE_READY=false
            for ATTEMPT in $(seq 1 30); do
              if $FABLESPACE_COMPOSE $FABLESPACE_COMPOSE_FILES exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()" >/dev/null 2>&1; then
                FABLESPACE_READY=true
                break
              fi
              sleep 2
            done
            if [ "${FABLESPACE_READY}" != "true" ]; then
              $FABLESPACE_COMPOSE $FABLESPACE_COMPOSE_FILES logs --tail=120 backend
              echo "FableSpace backend health check failed after SSO repair"
              exit 1
            fi

            sudo docker image prune -f

  deploy-full-stack:
    name: Deploy full stack (compose)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.compose == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build frontend image on runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: VITE_API_BASE_URL=/api/v1
          tags: parallellines-web:latest
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Export frontend image archive
        run: docker save parallellines-web:latest | gzip > "/tmp/parallellines-web-${GITHUB_SHA}.tar.gz"

      - name: Upload frontend image archive to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "${PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -P "${PORT}" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "/tmp/parallellines-web-${GITHUB_SHA}.tar.gz" "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/parallellines-web-${GITHUB_SHA}.tar.gz"

      - name: Deploy all services to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 30m
          script: |
            set -e
            WEB_IMAGE_ARCHIVE="/tmp/parallellines-web-${{ github.sha }}.tar.gz"
            DEPLOY_STARTED_AT=$(date +%s)
            echo "[deploy] mode=full stack reason=docker-compose changed"

            STEP_STARTED_AT=$(date +%s)
            cd /opt/parallellines
            git remote set-url origin https://github.com/${{ github.repository }}.git
            git fetch --prune origin main
            git reset --hard origin/main
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] checkout took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            STEP_STARTED_AT=$(date +%s)
            sudo install -d -m 0775 -o root -g root /opt/parallellines/var/uploads /opt/parallellines/var/backups /opt/parallellines/var/letsencrypt /opt/parallellines/var/certbot
            sudo chmod 0775 /opt/parallellines/var/uploads /opt/parallellines/var/backups /opt/parallellines/var/letsencrypt /opt/parallellines/var/certbot
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] storage directory check took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            STEP_STARTED_AT=$(date +%s)
            sudo docker load -i "${WEB_IMAGE_ARCHIVE}"
            rm -f "${WEB_IMAGE_ARCHIVE}"
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] frontend image load took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            STEP_STARTED_AT=$(date +%s)
            if sudo docker compose version >/dev/null 2>&1; then
              COMPOSE="sudo docker compose"
            else
              COMPOSE="sudo docker-compose"
            fi
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] compose detection took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            STEP_STARTED_AT=$(date +%s)
            $COMPOSE build api worker nginx
            $COMPOSE up -d --no-build
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] compose full deploy took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            STEP_STARTED_AT=$(date +%s)
            if sudo test -s /opt/parallellines/var/letsencrypt/live/pingxingxian.space/fullchain.pem && sudo test -s /opt/parallellines/var/letsencrypt/live/pingxingxian.space/privkey.pem; then
              echo "[deploy] certificate already exists; skipping certbot bootstrap"
            else
              echo "[deploy] certificate missing; requesting initial Let's Encrypt certificate"
              if $COMPOSE run --rm --entrypoint certbot certbot certonly --webroot -w /var/www/certbot --cert-name pingxingxian.space --keep-until-expiring --non-interactive --agree-tos --register-unsafely-without-email -d pingxingxian.space -d www.pingxingxian.space; then
                $COMPOSE exec -T nginx sh -c 'ln -sf /etc/letsencrypt/live/pingxingxian.space/fullchain.pem /etc/nginx/ssl/live/fullchain.pem && ln -sf /etc/letsencrypt/live/pingxingxian.space/privkey.pem /etc/nginx/ssl/live/privkey.pem && nginx -s reload'
              else
                echo "::warning::Let's Encrypt certificate request failed; Nginx is running with a temporary self-signed certificate."
              fi
            fi
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] certificate check took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            STEP_STARTED_AT=$(date +%s)
            sudo docker image prune -f
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] image prune took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            DEPLOY_FINISHED_AT=$(date +%s)
            echo "[deploy] total took $((DEPLOY_FINISHED_AT - DEPLOY_STARTED_AT))s"

  deploy-backend:
    name: Deploy backend (api + worker)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.backend == 'true' && needs.changes.outputs.compose != 'true'

    steps:
      - name: Deploy backend services to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 20m
          script: |
            set -e
            DEPLOY_STARTED_AT=$(date +%s)
            echo "[deploy] mode=backend services=api,worker"

            STEP_STARTED_AT=$(date +%s)
            cd /opt/parallellines
            git remote set-url origin https://github.com/${{ github.repository }}.git
            git fetch --prune origin main
            git reset --hard origin/main
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] checkout took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            STEP_STARTED_AT=$(date +%s)
            sudo install -d -m 0775 -o root -g root /opt/parallellines/var/uploads /opt/parallellines/var/backups /opt/parallellines/var/letsencrypt /opt/parallellines/var/certbot
            sudo chmod 0775 /opt/parallellines/var/uploads /opt/parallellines/var/backups /opt/parallellines/var/letsencrypt /opt/parallellines/var/certbot
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] storage directory check took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            STEP_STARTED_AT=$(date +%s)
            if sudo docker compose version >/dev/null 2>&1; then
              COMPOSE="sudo docker compose"
            else
              COMPOSE="sudo docker-compose"
            fi
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] compose detection took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            STEP_STARTED_AT=$(date +%s)
            FULL_BOOTSTRAP=false
            if ! $COMPOSE ps --services --status running 2>/dev/null | grep -qx nginx; then
              echo "[deploy] nginx is not running; falling back to full bootstrap"
              FULL_BOOTSTRAP=true
              $COMPOSE up -d --build
            else
              $COMPOSE up -d --build api worker
              $COMPOSE exec -T nginx nginx -s reload
            fi
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] backend deploy took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            if [ "${FULL_BOOTSTRAP}" = "true" ]; then
              STEP_STARTED_AT=$(date +%s)
              if sudo test -s /opt/parallellines/var/letsencrypt/live/pingxingxian.space/fullchain.pem && sudo test -s /opt/parallellines/var/letsencrypt/live/pingxingxian.space/privkey.pem; then
                echo "[deploy] certificate already exists; skipping certbot bootstrap"
              else
                echo "[deploy] certificate missing after bootstrap; requesting initial Let's Encrypt certificate"
                if $COMPOSE run --rm --entrypoint certbot certbot certonly --webroot -w /var/www/certbot --cert-name pingxingxian.space --keep-until-expiring --non-interactive --agree-tos --register-unsafely-without-email -d pingxingxian.space -d www.pingxingxian.space; then
                  $COMPOSE exec -T nginx sh -c 'ln -sf /etc/letsencrypt/live/pingxingxian.space/fullchain.pem /etc/nginx/ssl/live/fullchain.pem && ln -sf /etc/letsencrypt/live/pingxingxian.space/privkey.pem /etc/nginx/ssl/live/privkey.pem && nginx -s reload'
                else
                  echo "::warning::Let's Encrypt certificate request failed; Nginx is running with a temporary self-signed certificate."
                fi
              fi
              STEP_FINISHED_AT=$(date +%s)
              echo "[deploy] bootstrap certificate check took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"
            fi

            STEP_STARTED_AT=$(date +%s)
            sudo docker image prune -f
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] image prune took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            DEPLOY_FINISHED_AT=$(date +%s)
            echo "[deploy] total took $((DEPLOY_FINISHED_AT - DEPLOY_STARTED_AT))s"

  deploy-frontend:
    name: Deploy frontend (web)
    runs-on: ubuntu-latest
    needs:
      - changes
      - deploy-backend
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.changes.outputs.frontend == 'true' &&
      needs.changes.outputs.compose != 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build frontend image on runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: VITE_API_BASE_URL=/api/v1
          tags: parallellines-web:latest
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Export frontend image archive
        run: docker save parallellines-web:latest | gzip > "/tmp/parallellines-web-${GITHUB_SHA}.tar.gz"

      - name: Upload frontend image archive to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "${PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -P "${PORT}" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "/tmp/parallellines-web-${GITHUB_SHA}.tar.gz" "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/parallellines-web-${GITHUB_SHA}.tar.gz"

      - name: Deploy frontend service to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 20m
          script: |
            set -e
            DEPLOY_STARTED_AT=$(date +%s)
            WEB_IMAGE_ARCHIVE="/tmp/parallellines-web-${{ github.sha }}.tar.gz"
            echo "[deploy] mode=frontend service=web"

            STEP_STARTED_AT=$(date +%s)
            cd /opt/parallellines
            git remote set-url origin https://github.com/${{ github.repository }}.git
            git fetch --prune origin main
            git reset --hard origin/main
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] checkout took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            STEP_STARTED_AT=$(date +%s)
            sudo install -d -m 0775 -o root -g root /opt/parallellines/var/uploads /opt/parallellines/var/backups /opt/parallellines/var/letsencrypt /opt/parallellines/var/certbot
            sudo chmod 0775 /opt/parallellines/var/uploads /opt/parallellines/var/backups /opt/parallellines/var/letsencrypt /opt/parallellines/var/certbot
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] storage directory check took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"
            STEP_STARTED_AT=$(date +%s)
            sudo docker load -i "${WEB_IMAGE_ARCHIVE}"
            rm -f "${WEB_IMAGE_ARCHIVE}"
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] image load took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            STEP_STARTED_AT=$(date +%s)
            if sudo docker compose version >/dev/null 2>&1; then
              COMPOSE="sudo docker compose"
            else
              COMPOSE="sudo docker-compose"
            fi
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] compose detection took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            STEP_STARTED_AT=$(date +%s)
            FULL_BOOTSTRAP=false
            if ! $COMPOSE ps --services --status running 2>/dev/null | grep -qx nginx; then
              echo "[deploy] nginx is not running; falling back to full bootstrap"
              FULL_BOOTSTRAP=true
              $COMPOSE up -d --build db redis api worker
              $COMPOSE up -d --no-deps --no-build --force-recreate web
              $COMPOSE up -d --no-deps --build nginx
              $COMPOSE up -d --no-deps certbot
            else
              $COMPOSE up -d --no-deps --no-build --force-recreate web
              $COMPOSE exec -T nginx nginx -s reload
            fi
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] frontend deploy took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            if [ "${FULL_BOOTSTRAP}" = "true" ]; then
              STEP_STARTED_AT=$(date +%s)
              if sudo test -s /opt/parallellines/var/letsencrypt/live/pingxingxian.space/fullchain.pem && sudo test -s /opt/parallellines/var/letsencrypt/live/pingxingxian.space/privkey.pem; then
                echo "[deploy] certificate already exists; skipping certbot bootstrap"
              else
                echo "[deploy] certificate missing after bootstrap; requesting initial Let's Encrypt certificate"
                if $COMPOSE run --rm --entrypoint certbot certbot certonly --webroot -w /var/www/certbot --cert-name pingxingxian.space --keep-until-expiring --non-interactive --agree-tos --register-unsafely-without-email -d pingxingxian.space -d www.pingxingxian.space; then
                  $COMPOSE exec -T nginx sh -c 'ln -sf /etc/letsencrypt/live/pingxingxian.space/fullchain.pem /etc/nginx/ssl/live/fullchain.pem && ln -sf /etc/letsencrypt/live/pingxingxian.space/privkey.pem /etc/nginx/ssl/live/privkey.pem && nginx -s reload'
                else
                  echo "::warning::Let's Encrypt certificate request failed; Nginx is running with a temporary self-signed certificate."
                fi
              fi
              STEP_FINISHED_AT=$(date +%s)
              echo "[deploy] bootstrap certificate check took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"
            fi

            STEP_STARTED_AT=$(date +%s)
            sudo docker image prune -f
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] image prune took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            DEPLOY_FINISHED_AT=$(date +%s)
            echo "[deploy] total took $((DEPLOY_FINISHED_AT - DEPLOY_STARTED_AT))s"

  deploy-nginx:
    name: Deploy nginx edge
    runs-on: ubuntu-latest
    needs:
      - changes
      - deploy-backend
      - deploy-frontend
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.changes.outputs.nginx == 'true' &&
      needs.changes.outputs.compose != 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
      (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped')

    steps:
      - name: Deploy nginx service to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 20m
          script: |
            set -e
            DEPLOY_STARTED_AT=$(date +%s)
            echo "[deploy] mode=nginx service=nginx"

            STEP_STARTED_AT=$(date +%s)
            cd /opt/parallellines
            git remote set-url origin https://github.com/${{ github.repository }}.git
            git fetch --prune origin main
            git reset --hard origin/main
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] checkout took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            STEP_STARTED_AT=$(date +%s)
            sudo install -d -m 0775 -o root -g root /opt/parallellines/var/letsencrypt /opt/parallellines/var/certbot
            sudo chmod 0775 /opt/parallellines/var/letsencrypt /opt/parallellines/var/certbot
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] certificate directory check took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            STEP_STARTED_AT=$(date +%s)
            if sudo docker compose version >/dev/null 2>&1; then
              COMPOSE="sudo docker compose"
            else
              COMPOSE="sudo docker-compose"
            fi
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] compose detection took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            STEP_STARTED_AT=$(date +%s)
            if ! $COMPOSE ps --services --status running 2>/dev/null | grep -qx nginx; then
              echo "[deploy] nginx is not running; falling back to full bootstrap"
              $COMPOSE up -d --build
            else
              $COMPOSE up -d --no-deps --build nginx
            fi
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] nginx deploy took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            STEP_STARTED_AT=$(date +%s)
            if sudo test -s /opt/parallellines/var/letsencrypt/live/pingxingxian.space/fullchain.pem && sudo test -s /opt/parallellines/var/letsencrypt/live/pingxingxian.space/privkey.pem; then
              echo "[deploy] certificate already exists; skipping certbot bootstrap"
            else
              echo "[deploy] certificate missing; requesting initial Let's Encrypt certificate"
              if $COMPOSE run --rm --entrypoint certbot certbot certonly --webroot -w /var/www/certbot --cert-name pingxingxian.space --keep-until-expiring --non-interactive --agree-tos --register-unsafely-without-email -d pingxingxian.space -d www.pingxingxian.space; then
                $COMPOSE exec -T nginx sh -c 'ln -sf /etc/letsencrypt/live/pingxingxian.space/fullchain.pem /etc/nginx/ssl/live/fullchain.pem && ln -sf /etc/letsencrypt/live/pingxingxian.space/privkey.pem /etc/nginx/ssl/live/privkey.pem && nginx -s reload'
              else
                echo "::warning::Let's Encrypt certificate request failed; Nginx is running with a temporary self-signed certificate."
              fi
            fi
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] certificate check took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            STEP_STARTED_AT=$(date +%s)
            sudo docker image prune -f
            STEP_FINISHED_AT=$(date +%s)
            echo "[deploy] image prune took $((STEP_FINISHED_AT - STEP_STARTED_AT))s"

            DEPLOY_FINISHED_AT=$(date +%s)
            echo "[deploy] total took $((DEPLOY_FINISHED_AT - DEPLOY_STARTED_AT))s"
