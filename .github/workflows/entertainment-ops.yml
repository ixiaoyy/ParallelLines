name: Entertainment module operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed Matrix module operation; inventory never changes services
        type: choice
        required: true
        default: inventory
        options: [inventory, prepare, deploy, bootstrap, prepare-tls, publish, retract, install-renewal, renew, renewal-status, health, stop, enable-main-login, restore-main-login, main-login-status, tavern-release-status, publish-tavern-bridge, rollback-tavern-bridge, publish-tavern-frontend, rollback-tavern-frontend]
      chat_revision:
        description: Reviewed full Chat main SHA (Tavern release actions only)
        type: string
        default: ''
      expected_image_id:
        description: Current target image ID from tavern-release-status (publish only)
        type: string
        default: ''
      frontend_manifest_sha256:
        description: Reviewed public frontend manifest SHA-256 (publish-tavern-frontend only)
        type: string
        default: ''
      tavern_login_verified:
        description: Manually verified both Tavern sign-in paths (publish-tavern-frontend only)
        type: boolean
        default: false
      tavern_login_waived:
        description: Owner approved this Chat release without manual login acceptance (publish-tavern-frontend only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 独立读取不等待发布；写操作与现有生产发布共用互斥组。
  group: ${{ (inputs.operation == 'inventory' || inputs.operation == 'health' || inputs.operation == 'renewal-status' || inputs.operation == 'main-login-status' || inputs.operation == 'tavern-release-status') && format('entertainment-read-{0}', inputs.operation) || 'deploy-production' }}
  cancel-in-progress: false

jobs:
  entertainment:
    if: github.repository == 'ixiaoyy/ParallelLines' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      REGISTERED_RUNTIME_OPERATIONS: '["install-renewal","renew","renewal-status","enable-main-login","restore-main-login","main-login-status"]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      # 续期和单点登录回执仍固定旧源码；运行程序及回执完成受控升级后移除此兼容入口。
      - name: Check out only the registered runtime source
        if: contains(fromJSON(env.REGISTERED_RUNTIME_OPERATIONS), inputs.operation)
        uses: actions/checkout@v4
        with:
          ref: 1abefac5b9b20af63f9821d010cfe7efb1b88752
          path: .registered-entertainment-runtime
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: /.github/scripts/entertainment_ops.py
          sparse-checkout-cone-mode: false
      - name: Prepare only the reviewed fixed operation
        id: payload
        env:
          OPERATION: ${{ inputs.operation }}
          OPERATION_REVISION: ${{ github.sha }}
          CHAT_REVISION: ${{ inputs.chat_revision }}
          EXPECTED_IMAGE_ID: ${{ inputs.expected_image_id }}
          FRONTEND_MANIFEST_SHA256: ${{ inputs.frontend_manifest_sha256 }}
          TAVERN_LOGIN_VERIFIED: ${{ inputs.tavern_login_verified }}
          TAVERN_LOGIN_WAIVED: ${{ inputs.tavern_login_waived }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,re,subprocess,uuid,zlib
          from pathlib import Path
          operation=os.environ['OPERATION']
          sso_operations=('enable-main-login','restore-main-login','main-login-status')
          tavern_release=('publish-tavern-bridge','rollback-tavern-bridge','publish-tavern-frontend','rollback-tavern-frontend','tavern-release-status')
          if operation not in ('inventory','prepare','deploy','bootstrap','prepare-tls','publish','retract','install-renewal','renew','renewal-status','health','stop')+sso_operations+tavern_release: raise SystemExit('Unsupported entertainment operation')
          revision=os.environ['OPERATION_REVISION']
          if not re.fullmatch('[a-f0-9]{40}',revision): raise SystemExit('Reviewed operation identity required')
          args=[operation]
          native_path='.github/scripts/entertainment_ops.py'
          waived=os.environ['TAVERN_LOGIN_WAIVED']=='true'
          if waived and operation!='publish-tavern-frontend': raise SystemExit('Acceptance waiver is for the Chat frontend only')
          if operation in tavern_release:
              chat_revision=os.environ['CHAT_REVISION']
              if not re.fullmatch('[a-f0-9]{40}',chat_revision): raise SystemExit('Reviewed Chat revision required')
              args.append(chat_revision)
              if operation.startswith('publish-'):
                  image_id=os.environ['EXPECTED_IMAGE_ID']
                  if not re.fullmatch('sha256:[a-f0-9]{64}',image_id): raise SystemExit('Reviewed current image ID required')
                  args+=['--expected-image-id',image_id]
              if operation=='publish-tavern-frontend':
                  manifest=os.environ['FRONTEND_MANIFEST_SHA256']
                  if not re.fullmatch('[a-f0-9]{64}',manifest): raise SystemExit('Reviewed public frontend manifest required')
                  verified=os.environ['TAVERN_LOGIN_VERIFIED']=='true'
                  if verified==waived: raise SystemExit('Choose manual acceptance or the explicit release waiver')
                  args+=['--frontend-manifest-sha256',manifest,'--login-verified' if verified else '--login-waived']
              operator=Path('.github/scripts/tavern_release_ops.py').read_text(encoding='utf-8')
              # 回退入口保留已审操作器原文；所有远程 argv 仍是固定枚举、布尔或校验后的摘要。
              source='OPERATOR_SOURCE='+repr(operator)+'\n'+operator
          elif operation in json.loads(os.environ['REGISTERED_RUNTIME_OPERATIONS']):
              try:
                  native_source=subprocess.check_output(
                      ['git','-C','.registered-entertainment-runtime','show','HEAD:'+native_path],timeout=5)
              except (subprocess.SubprocessError,OSError):
                  raise SystemExit('Unable to read the registered entertainment operations source') from None
              if hashlib.sha256(native_source).hexdigest()!='005694547821f42e5778ab7819970e3f113599d3c57cd47e6bcb4732f8184335':
                  raise SystemExit('Registered entertainment operations source digest mismatch')
              source=native_source.decode('utf-8')
          else:
              source=Path(native_path).read_text(encoding='utf-8')
          if operation in sso_operations:
              extension=Path('.github/scripts/entertainment_sso.py').read_text(encoding='utf-8')
              # 原续期 source 原字节导入；新入口不改旧消费者及其来源守卫。
              bundle={'native':source,'sso':extension,'revision':revision}
              loader="import sys,types\nBUNDLED_PROGRAM='BUNDLE='+repr(BUNDLE)+'\\nLOADER='+repr(LOADER)+'\\nexec(LOADER)\\n'\nmodule=types.ModuleType('entertainment_ops')\nmodule.__dict__.update(OPS_SOURCE=BUNDLE['native'],OPS_REVISION=BUNDLE['revision'])\nsys.modules['entertainment_ops']=module\nexec(compile(BUNDLE['native'], '<fixed-entertainment-ops>', 'exec'),module.__dict__)\n"
              loader+="exec(compile(BUNDLE['sso'], '<fixed-tavern-sso>', 'exec'),{'__name__':'__main__','__file__':globals().get('__file__','<fixed-tavern-sso>'),'SSO_SOURCE':BUNDLE['sso'],'SSO_PROGRAM_SOURCE':BUNDLED_PROGRAM,'OPS_REVISION':BUNDLE['revision']})\n"
              prefix='BUNDLE='+repr(bundle)+'\nLOADER='+repr(loader)+'\n'
              # 保存的独立程序与实际执行的固定 bundle 相同，断开 GitHub 后仍可恢复。
              source=prefix+'exec(LOADER)\n'
          marker='PL_ENTERTAINMENT_'+uuid.uuid4().hex
          # 只压缩当前 checkout 的公开固定 source 适配 SSH exec 长度；绝不编码生产响应或凭据。
          encoded=base64.b64encode(zlib.compress(source.encode('utf-8'),9)).decode('ascii')
          source_digest=hashlib.sha256(source.encode('utf-8')).hexdigest()
          program="import base64,hashlib,zlib\nOPS_REVISION="+repr(revision)+"\nOPS_SOURCE=zlib.decompress(base64.b64decode("+repr(encoded)+")).decode('utf-8')\n"
          program+="assert hashlib.sha256(OPS_SOURCE.encode('utf-8')).hexdigest()=="+repr(source_digest)+"\nexec(compile(OPS_SOURCE, '<fixed-entertainment-ops>', 'exec'))\n"
          payload="set -eu\nsudo -n python3 -B - "+' '.join(args)+" <<'"+marker+"'\n"+program+marker+'\n'
          if len(payload.encode())>120000: raise SystemExit('Fixed operation exceeds SSH transport bound')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write('script<<'+marker+'_OUTPUT\n'+payload+marker+'_OUTPUT\n')
          PY
      - name: Execute only the selected entertainment operation
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          fingerprint: SHA256:3XgT+rjG+BpWEyVWUwI2p2SVojjzHpSxrbUFhLj15Ws
          timeout: 30s
          command_timeout: ${{ (inputs.operation == 'publish-tavern-bridge' || inputs.operation == 'publish-tavern-frontend') && '22m' || inputs.operation == 'prepare' && '15m' || (inputs.operation == 'deploy' || inputs.operation == 'prepare-tls' || inputs.operation == 'publish' || inputs.operation == 'renew' || inputs.operation == 'enable-main-login' || inputs.operation == 'restore-main-login' || inputs.operation == 'rollback-tavern-bridge' || inputs.operation == 'rollback-tavern-frontend') && '8m' || '5m' }}
          script_stop: false
          script: ${{ steps.payload.outputs.script }}
